name: Stage 16A.2 Wire Transcript Annotations

on:
  push:
    branches: [stage16a2-timeline-annotation]
    paths:
      - '.github/workflows/stage16a2-wire-transcript-annotations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage branch
        uses: actions/checkout@v5
        with:
          ref: stage16a2-timeline-annotation
          fetch-depth: 0
      - name: Patch transcript annotation entry
        run: python tools/stage16a2_patch_transcript_annotations.py
      - name: Commit patch and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage16a2-wire-transcript-annotations.yml
          git rm tools/stage16a2_patch_transcript_annotations.py
          git add app/src/main/java/io/github/ioannes78/voica/ui/annotation/TimelineAnnotationViewModel.kt
          git add app/src/main/java/io/github/ioannes78/voica/ui/transcript/TranscriptionCards.kt
          git add app/src/main/java/io/github/ioannes78/voica/ui/library/RecordingDetailProductScreen.kt
          git commit -m 'feat(annotation): add transcript timeline entry'
          git push origin HEAD:stage16a2-timeline-annotation

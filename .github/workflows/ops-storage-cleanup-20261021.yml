name: One-time approved QA artifact cleanup

'on':
  push:
    branches: [ops/actions-storage-cleanup-20261021]
    paths: [.github/workflows/ops-storage-cleanup-20261021.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: ops-storage-cleanup-20261021
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'ioannes78/voica-android' && github.ref == 'refs/heads/ops/actions-storage-cleanup-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete only the 1 user-approved old QA artifacts and verify all preserved artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          
          REPO = "ioannes78/voica-android"
          MAIN = "988931ebed72a70ba799d909cd36a416a673eef5"
          PLAN = json.loads("[{\"id\":12249693461,\"run\":39391904005,\"name\":\"Voica-1.1.0-stage16a2-export-qa-apk\",\"bytes\":32048620,\"branch\":\"stage16b-local-file-asr-v2\",\"sha\":\"2ccda951e194b0f9eca9bdeb7cd4ee2c6eabf6cc\",\"digest\":\"sha256:2203b0c1a81a7fa45f22535e07a4c94948a74a59374f2a5cc952485cad474246\"}]")
          KEEP = {12310078138, 12289211982, 12126176254}
          TARGETS = {item["id"] for item in PLAN}
          assert len(PLAN) == len(TARGETS) == 1
          assert not TARGETS & KEEP
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == "refs/heads/ops/actions-storage-cleanup-20261021"
          
          def api(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/" + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Voica-authorized-storage-cleanup"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise RuntimeError(f"{method} {path}: HTTP {exc.code}") from None
          
          def required(path):
              status, data = api(path)
              assert status == 200, (path, status)
              return data
          
          def inventory():
              found = {}
              page = 1
              while True:
                  batch = required(f"actions/artifacts?per_page=100&page={page}")["artifacts"]
                  for item in batch:
                      assert item["id"] not in found
                      found[item["id"]] = item
                  if len(batch) < 100:
                      return found
                  page += 1
          
          def fingerprint(a):
              return (a["id"], a["name"], a["size_in_bytes"], a.get("digest"), a["workflow_run"]["id"])
          
          def validate(expected, actual):
              assert actual["id"] == expected["id"]
              assert actual["name"] == expected["name"]
              assert actual["size_in_bytes"] == expected["bytes"]
              assert actual.get("digest") == expected["digest"]
              assert actual["workflow_run"]["id"] == expected["run"]
              assert actual["workflow_run"]["head_branch"] == expected["branch"]
              assert actual["workflow_run"]["head_sha"] == expected["sha"]
              assert actual["name"] in {
                  "Voica-1.1.0-stage16a2-export-qa-apk",
                  "Voica-1.1.0-stage16a-export-qa-apk"
              }
              assert actual["id"] not in KEEP
          
          assert required("git/ref/heads/main")["object"]["sha"] == MAIN
          release_before = required("releases/tags/v1.0.0")
          before = inventory()
          assert KEEP <= before.keys(), "A required QA baseline is missing; refuse deletion"
          protected = {key: fingerprint(item) for key, item in before.items() if key not in TARGETS}
          candidates = []
          for expected in PLAN:
              if expected["id"] not in before:
                  print(f"Already absent: {expected['id']}")
                  continue
              validate(expected, before[expected["id"]])
              current = required(f"actions/artifacts/{expected['id']}")
              validate(expected, current)
              candidates.append(expected)
          print(f"Preflight PASS: {len(candidates)} exact targets; {len(protected)} other artifacts protected", flush=True)
          
          deleted = []
          for expected in candidates:
              path = f"actions/artifacts/{expected['id']}"
              current = required(path)
              validate(expected, current)
              status, _ = api(path, "DELETE")
              assert status == 204, (expected["id"], status)
              deleted.append(expected)
              verify_status, _ = api(path)
              assert verify_status == 404, f"Deleted artifact still readable: {expected['id']}"
              print(f"Deleted {expected['id']} / run {expected['run']} / {expected['bytes']} bytes", flush=True)
          
          after = inventory()
          assert not TARGETS & after.keys(), "An approved deletion target remains"
          for key, expected in protected.items():
              assert key in after, f"Protected artifact disappeared: {key}"
              assert fingerprint(after[key]) == expected, f"Protected artifact changed: {key}"
          assert KEEP <= after.keys()
          assert required("git/ref/heads/main")["object"]["sha"] == MAIN
          release_after = required("releases/tags/v1.0.0")
          assert release_before["id"] == release_after["id"]
          assert {(a["id"], a["name"], a["size"], a.get("digest")) for a in release_before["assets"]} == {(a["id"], a["name"], a["size"], a.get("digest")) for a in release_after["assets"]}
          total_bytes = sum(item["bytes"] for item in deleted)
          summary = {
              "deleted_count": len(deleted),
              "deleted_bytes": total_bytes,
              "already_absent_count": len(PLAN) - len(candidates),
              "protected_artifacts_verified": len(protected),
              "remaining_artifact_count": len(after),
              "remaining_artifact_bytes": sum(a["size_in_bytes"] for a in after.values() if not a["expired"]),
              "preserved_qa_artifact_ids": sorted(KEEP),
              "main_unchanged": MAIN,
              "release_v1_0_0_unchanged": True,
              "workflow_runs_and_caches": "untouched"
          }
          print("CLEANUP_RESULT=" + json.dumps(summary, sort_keys=True), flush=True)
          print("REMAINING_INVENTORY=" + json.dumps([{"id": a["id"], "name": a["name"], "bytes": a["size_in_bytes"], "expired": a["expired"], "run": a["workflow_run"]["id"]} for a in after.values()], sort_keys=True), flush=True)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("# Actions 存储清理结果\n\n")
              f.write(f"删除 {len(deleted)} 个指定旧 QA APK，共 {total_bytes:,} bytes。\n\n")
              f.write("最新可用 QA #2083、上一份不同提交的 QA #2076、上一阶段基线 #1763、全部其他 Artifact、v1.0.0 Release 已核验保留。\n\n")
              f.write("main、Workflow Run/CI 历史、Cache 均未改动。\n\n")
              f.write("\n".join(f"- Artifact {x['id']} / run {x['run']}" for x in deleted) + "\n")
          PY

name: Stage 16A.2 Fix P5 MIME

on:
  push:
    branches: [stage16a2-timeline-annotation]
    paths:
      - '.github/workflows/stage16a2-fix-p5-mime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage branch
        uses: actions/checkout@v5
        with:
          ref: stage16a2-timeline-annotation
          fetch-depth: 0
      - name: Patch image MIME fallback
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/io/github/ioannes78/voica/TimelineAnnotationAttachmentStore.kt')
          source = path.read_text()
          old = '''        val mimeType =
              bounds.mimeType?.takeIf { it.startsWith("image/") }
                  ?: providerMimeType?.takeIf { it.startsWith("image/") }
                  ?: error("不支持的图片格式")
          '''
          new = '''        val mimeType =
              bounds.mimeType?.takeIf { it.startsWith("image/") }
                  ?: providerMimeType?.takeIf { it.startsWith("image/") }
                  ?: detectImageMime(sourceFile)
                  ?: error("不支持的图片格式")
          '''
          if old not in source:
              raise SystemExit('MIME decision block not found')
          source = source.replace(old, new, 1)
          marker = '''    private fun extensionForMime(mimeType: String): String =
          '''
          helper = '''    private fun detectImageMime(file: File): String? {
              val header = ByteArray(32)
              val read =
                  FileInputStream(file).use { input ->
                      input.read(header).coerceAtLeast(0)
                  }
              if (
                  read >= 8 &&
                  header[0] == 0x89.toByte() &&
                  header[1] == 0x50.toByte() &&
                  header[2] == 0x4E.toByte() &&
                  header[3] == 0x47.toByte() &&
                  header[4] == 0x0D.toByte() &&
                  header[5] == 0x0A.toByte() &&
                  header[6] == 0x1A.toByte() &&
                  header[7] == 0x0A.toByte()
              ) {
                  return "image/png"
              }
              if (
                  read >= 3 &&
                  header[0] == 0xFF.toByte() &&
                  header[1] == 0xD8.toByte() &&
                  header[2] == 0xFF.toByte()
              ) {
                  return "image/jpeg"
              }
              if (
                  read >= 12 &&
                  String(header, 0, 4, Charsets.US_ASCII) == "RIFF" &&
                  String(header, 8, 4, Charsets.US_ASCII) == "WEBP"
              ) {
                  return "image/webp"
              }
              if (read >= 12 && String(header, 4, 4, Charsets.US_ASCII) == "ftyp") {
                  return when (String(header, 8, 4, Charsets.US_ASCII).lowercase()) {
                      "heic", "heix", "hevc", "hevx", "heim", "heis" -> "image/heic"
                      "heif", "mif1", "msf1" -> "image/heif"
                      else -> null
                  }
              }
              return null
          }

          '''
          if marker not in source:
              raise SystemExit('extensionForMime marker not found')
          source = source.replace(marker, helper + marker, 1)
          path.write_text(source)
      - name: Commit patch and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage16a2-fix-p5-mime.yml
          git add app/src/main/java/io/github/ioannes78/voica/TimelineAnnotationAttachmentStore.kt
          git commit -m 'fix(annotation): detect image MIME from file header'
          git push origin HEAD:stage16a2-timeline-annotation
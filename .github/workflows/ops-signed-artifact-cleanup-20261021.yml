name: One-time approved historical signed artifact cleanup

'on':
  push:
    branches: [ops/signed-artifact-cleanup-20261021]
    paths: [.github/workflows/ops-signed-artifact-cleanup-20261021.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: ops-storage-cleanup-20261021
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'ioannes78/voica-android' && github.ref == 'refs/heads/ops/signed-artifact-cleanup-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete only the 27 user-approved historical signed artifacts and verify all preserved artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          
          REPO = "ioannes78/voica-android"
          MAIN = "988931ebed72a70ba799d909cd36a416a673eef5"
          PLAN = json.loads("[{\"id\":11933940168,\"run\":38647625229,\"name\":\"Voica-1.1.0-stage16a-candidate-apk\",\"bytes\":30930299,\"branch\":\"stage16a-local-true-streaming-asr\",\"sha\":\"8595d4368d75e19466ed589655abf6ce3b059872\",\"digest\":\"sha256:b247d837a022c9f4a2e6ebb676a04e748397f794691f98edec47411ffa7563e1\"},{\"id\":11933556480,\"run\":38647625229,\"name\":\"Voica-1.1.0-stage16a-candidate-provenance\",\"bytes\":4889962,\"branch\":\"stage16a-local-true-streaming-asr\",\"sha\":\"8595d4368d75e19466ed589655abf6ce3b059872\",\"digest\":\"sha256:5322484cf72e52e60c3bee39698ff48e6652046d7b31b36298b47d0bc5602b47\"},{\"id\":11933267762,\"run\":38647625229,\"name\":\"Voica-1.1.0-stage16a-candidate-aab\",\"bytes\":26411739,\"branch\":\"stage16a-local-true-streaming-asr\",\"sha\":\"8595d4368d75e19466ed589655abf6ce3b059872\",\"digest\":\"sha256:fc4a0c797ce43e1b300753aa2e674f29823eba8850ac87b5d7127f637d53ceb5\"},{\"id\":11913235005,\"run\":38597130964,\"name\":\"Voica-1.1.0-stage16a-candidate-aab\",\"bytes\":26411742,\"branch\":\"stage16a-local-true-streaming-asr\",\"sha\":\"4b1fd4b759c0a826bb49a3e1620e714baea237df\",\"digest\":\"sha256:cd3473e879bc744815e6938933724342b14d26c6f63ddb6f31c79504537ae121\"},{\"id\":11912710161,\"run\":38597130964,\"name\":\"Voica-1.1.0-stage16a-candidate-provenance\",\"bytes\":4889963,\"branch\":\"stage16a-local-true-streaming-asr\",\"sha\":\"4b1fd4b759c0a826bb49a3e1620e714baea237df\",\"digest\":\"sha256:e83bbecbe98c2560fd3dee93e52da3c5325471e238ab5526d764c8c4af180c5c\"},{\"id\":11912550228,\"run\":38597130964,\"name\":\"Voica-1.1.0-stage16a-candidate-apk\",\"bytes\":30930299,\"branch\":\"stage16a-local-true-streaming-asr\",\"sha\":\"4b1fd4b759c0a826bb49a3e1620e714baea237df\",\"digest\":\"sha256:0c8a0e2c0d074098f18bd851ece51052818fcd8d901980f7ae677cd49a602d3c\"},{\"id\":11911912637,\"run\":38598067317,\"name\":\"Voica-1.1.0-stage16a-candidate-aab\",\"bytes\":26411730,\"branch\":\"stage16a-local-true-streaming-asr\",\"sha\":\"5ea8689489
y-optimization\",\"sha\":\"035f6da15eb26f4e423da48d60303c180e8449d5\",\"digest\":\"sha256:4923c74b4a01082baba7a6db541f39632421c6bb07e8e2d6cc54efcf8ac638e9\"},{\"id\":11673589823,\"run\":38063550022,\"name\":\"Voica-1.0.0-candidate-aab\",\"bytes\":25602931,\"branch\":\"ci-strategy-optimization\",\"sha\":\"035f6da15eb26f4e423da48d60303c180e8449d5\",\"digest\":\"sha256:2ea238f2f6efb24da4725d8daa8e25642233bc4c8fde14d83ff58db93e5e0ec4\"},{\"id\":11672569103,\"run\":38059802581,\"name\":\"Voica-V1-production-signed-aab\",\"bytes\":25364452,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"daa5446ce7d83b0ff80854914e5b798f3e0fc2bf\",\"digest\":\"sha256:57b16cdbb7d6f144e36dc9b4c565eb8695069a4d11c5cd54c843a3becd86e19c\"},{\"id\":11672244444,\"run\":38059802581,\"name\":\"Voica-V1-production-signing-provenance\",\"bytes\":4349903,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"daa5446ce7d83b0ff80854914e5b798f3e0fc2bf\",\"digest\":\"sha256:ef14bbb8c814a6852d2b890dc752f2c6f3be90cede93e26b2b67f646c2718204\"},{\"id\":11672214630,\"run\":38059802581,\"name\":\"Voica-V1-production-signed-apk\",\"bytes\":13293267,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"daa5446ce7d83b0ff80854914e5b798f3e0fc2bf\",\"digest\":\"sha256:5a1dd106ffb061a799ed4ff41a858224d38446800c4c3aabce31c6bc6ca1f8f0\"},{\"id\":11670860691,\"run\":38052083564,\"name\":\"Voica-V1-RC-production-signed-aab\",\"bytes\":25364327,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"846f68f317c0b3ef1c6b8d015ae4cdabe954ec37\",\"digest\":\"sha256:6ac9261cbbddc4b3cd4d92cad175abde644e04b28fc3d9d1a5eb4d3d7efb135e\"},{\"id\":11670546138,\"run\":38052083564,\"name\":\"Voica-V1-RC-production-signing-provenance\",\"bytes\":4349910,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"846f68f317c0b3ef1c6b8d015ae4cdabe954ec37\",\"digest\":\"sha256:44e51880a78b4e4934d0782e70f0dd0227ed68aa69dba89cb430c38495b994a5\"},{\"id\":11670231582,\"run\":38052083564,\"name\":\"Voica-V1-RC-production-signed-apk\",\"bytes\":13293013,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"846f68f317c0b3ef1c6b8d015ae4cdabe954ec37\",\"digest\":\"sha256:069b25931af8aeb7c78c1de233495547ef6e5acd195fbdd4877ba379027b833e\"},{\"id\":11667077422,\"run\":38044710898,\"name\":\"Voica-V1-RC-production-signing-provenance\",\"bytes\":4349908,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"47e00c7cca656e62ca93373ef652c26e275dbd0d\",\"digest\":\"sha256:d988510ee0e66f0213c8753b207eadd88ff8bd7152bc8d246864cb1bddcd49f8\"},{\"id\":11666882923,\"run\":38044710898,\"name\":\"Voica-V1-RC-production-signed-aab\",\"bytes\":25364324,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"47e00c7cca656e62ca93373ef652c26e275dbd0d\",\"digest\":\"sha256:25434c3f694814694267fbedadd024de261c06726e055de1a1664a20b24d72f7\"},{\"id\":11666853893,\"run\":38045651280,\"name\":\"Voica-V1-RC-production-signed-apk\",\"bytes\":13293031,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"c27e02aa936aead23b0710eec2e5a44c1c2cb78f\",\"digest\":\"sha256:95276645ad2fbc4211190b525edad3bf9f5be71c3a47d5c582b58e7da30effa1\"},{\"id\":11666814099,\"run\":38045651280,\"name\":\"Voica-V1-RC-production-signing-provenance\",\"bytes\":4349912,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"c27e02aa936aead23b0710eec2e5a44c1c2cb78f\",\"digest\":\"sha256:a776d9794952d02d8e5cc1ff60db4c327ae2495a638cdb351a8f3f0a5b4f1e94\"},{\"id\":11666669198,\"run\":38045651280,\"name\":\"Voica-V1-RC-production-signed-aab\",\"bytes\":25364325,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"c27e02aa936aead23b0710eec2e5a44c1c2cb78f\",\"digest\":\"sha256:f1f2d6351eb18b7a1d01a0fb54df61d665351ad7582fbf2f75796c0a56ff69ae\"},{\"id\":11666543541,\"run\":38044710898,\"name\":\"Voica-V1-RC-production-signed-apk\",\"bytes\":13293025,\"branch\":\"stage14-v1-release-freeze\",\"sha\":\"47e00c7cca656e62ca93373ef652c26e275dbd0d\",\"digest\":\"sha256:a4da209c76bb7a4ecd182af42261f69c91e00dcfe505a250d7fef1359db3702a\"}]")
          KEEP = {11671848627, 11671638631, 11671638628, 11984871677, 11984607105, 11984362791, 12310078138, 12289211982, 12126176254}
          TARGETS = {item["id"] for item in PLAN}
          assert len(PLAN) == len(TARGETS) == 27
          assert not TARGETS & KEEP
          assert os.environ["GITHUB_REPOSITORY"] == REPO
          assert os.environ["GITHUB_REF"] == "refs/heads/ops/signed-artifact-cleanup-20261021"
          
          def api(path, method="GET"):
              req = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/" + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "Voica-authorized-storage-cleanup"
                  }
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return 404, None
                  raise RuntimeError(f"{method} {path}: HTTP {exc.code}") from None
          
          def required(path):
              status, data = api(path)
              assert status == 200, (path, status)
              return data
          
          def inventory():
              found = {}
              page = 1
              while True:
                  batch = required(f"actions/artifacts?per_page=100&page={page}")["artifacts"]
                  for item in batch:
                      assert item["id"] not in found
                      found[item["id"]] = item
                  if len(batch) < 100:
                      return found
                  page += 1
          
          def fingerprint(a):
              return (a["id"], a["name"], a["size_in_bytes"], a.get("digest"), a["workflow_run"]["id"])
          
          def validate(expected, actual):
              assert actual["id"] == expected["id"]
              assert actual["name"] == expected["name"]
              assert actual["size_in_bytes"] == expected["bytes"]
              assert actual.get("digest") == expected["digest"]
              assert actual["workflow_run"]["id"] == expected["run"]
              assert actual["workflow_run"]["head_branch"] == expected["branch"]
              assert actual["workflow_run"]["head_sha"] == expected["sha"]
              assert actual["name"] in {"Voica-1.1.0-stage16a-candidate-apk", "Voica-1.1.0-stage16a-candidate-provenance", "Voica-1.1.0-stage16a-candidate-aab", "Voica-1.1.0-stage15-candidate-provenance", "Voica-1.1.0-stage15-candidate-aab", "Voica-1.1.0-stage15-candidate-apk", "Voica-1.0.0-candidate-apk", "Voica-1.0.0-candidate-provenance", "Voica-1.0.0-candidate-aab", "Voica-V1-production-signed-aab", "Voica-V1-production-signing-provenance", "Voica-V1-production-signed-apk", "Voica-V1-RC-production-signed-aab", "Voica-V1-RC-production-signing-provenance", "Voica-V1-RC-production-signed-apk"}
              assert not actual["name"].endswith("export-qa-apk")
              assert actual["id"] not in KEEP
          
          assert required("git/ref/heads/main")["object"]["sha"] == MAIN
          release_before = required("releases/tags/v1.0.0")
          before = inventory()
          assert KEEP <= before.keys(), "A required QA baseline is missing; refuse deletion"
          protected = {key: fingerprint(item) for key, item in before.items() if key not in TARGETS}
          candidates = []
          for expected in PLAN:
              if expected["id"] not in before:
                  print(f"Already absent: {expected['id']}")
                  continue
              validate(expected, before[expected["id"]])
              current = required(f"actions/artifacts/{expected['id']}")
              validate(expected, current)
              candidates.append(expected)
          print(f"Preflight PASS: {len(candidates)} exact targets; {len(protected)} other artifacts protected", flush=True)
          
          deleted = []
          for expected in candidates:
              path = f"actions/artifacts/{expected['id']}"
              current = required(path)
              validate(expected, current)
              status, _ = api(path, "DELETE")
              assert status == 204, (expected["id"], status)
              deleted.append(expected)
              verify_status, _ = api(path)
              assert verify_status == 404, f"Deleted artifact still readable: {expected['id']}"
              print(f"Deleted {expected['id']} / run {expected['run']} / {expected['bytes']} bytes", flush=True)
          
          after = inventory()
          assert not TARGETS & after.keys(), "An approved deletion target remains"
          for key, expected in protected.items():
              assert key in after, f"Protected artifact disappeared: {key}"
              assert fingerprint(after[key]) == expected, f"Protected artifact changed: {key}"
          assert KEEP <= after.keys()
          assert required("git/ref/heads/main")["object"]["sha"] == MAIN
          release_after = required("releases/tags/v1.0.0")
          assert release_before["id"] == release_after["id"]
          assert {(a["id"], a["name"], a["size"], a.get("digest")) for a in release_before["assets"]} == {(a["id"], a["name"], a["size"], a.get("digest")) for a in release_after["assets"]}
          total_bytes = sum(item["bytes"] for item in deleted)
          summary = {
              "deleted_count": len(deleted),
              "deleted_bytes": total_bytes,
              "already_absent_count": len(PLAN) - len(candidates),
              "protected_artifacts_verified": len(protected),
              "remaining_artifact_count": len(after),
              "remaining_artifact_bytes": sum(a["size_in_bytes"] for a in after.values() if not a["expired"]),
              "preserved_qa_artifact_ids": sorted(KEEP),
              "main_unchanged": MAIN,
              "release_v1_0_0_unchanged": True,
              "workflow_runs_and_caches": "untouched"
          }
          print("CLEANUP_RESULT=" + json.dumps(summary, sort_keys=True), flush=True)
          print("REMAINING_INVENTORY=" + json.dumps([{"id": a["id"], "name": a["name"], "bytes": a["size_in_bytes"], "expired": a["expired"], "run": a["workflow_run"]["id"]} for a in after.values()], sort_keys=True), flush=True)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as f:
              f.write("# Actions 存储清理结果\n\n")
              f.write(f"删除 {len(deleted)} 个指定旧签名产物，共 {total_bytes:,} bytes。\n\n")
              f.write("V1.0 正式验收产物 3 个、最新签名候选产物 3 个、现有 QA 及其他 Artifact、v1.0.0 Release 已核验保留。\n\n")
              f.write("main、Workflow Run/CI 历史、Cache 均未改动。\n\n")
              f.write("\n".join(f"- Artifact {x['id']} / run {x['run']}" for x in deleted) + "\n")
          PY

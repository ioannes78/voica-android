name: Android PR CI

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, edited]
    paths:
      - "app/**"
      - "core/**"
      - "engine/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-release-gate.yml"
      - "ci/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "PR validation mode"
        required: true
        default: fast
        type: choice
        options:
          - fast
          - qa

permissions:
  contents: write
  actions: write

jobs:
  fast-gate:
    name: Fast PR Gate
    if: >-
      ${{
        (github.event_name == 'pull_request' && github.event.action != 'edited') ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'fast')
      }}
    concurrency:
      group: android-ci-fast-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VOICA_BUILD_GIT_SHA: ci-fast

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply Stage5 legacy cleanup transform
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          models = Path("core/database/src/main/java/io/github/ioannes78/voica/database/RecordingImportModels.kt")
          text = models.read_text()
          if "enum class DeviceAssetFormat" not in text:
              marker = "package io.github.ioannes78.voica.database\n\n"
              enum = "enum class DeviceAssetFormat {\n    OPUS,\n    WAV,\n}\n\n"
              assert marker in text
              text = text.replace(marker, marker + enum, 1)
              models.write_text(text)

          for base in (Path("app/src"), Path("core/database/src")):
              for path in base.rglob("*.kt"):
                  content = path.read_text()
                  if "LegacyAssetFormat" in content:
                      path.write_text(content.replace("LegacyAssetFormat", "DeviceAssetFormat"))

          repo = Path("core/database/src/main/java/io/github/ioannes78/voica/database/RecordingLibraryRepository.kt")
          text = repo.read_text()

          start = text.index("data class LegacyImportReport(")
          end = text.index("data class LibraryDeleteResult(", start)
          text = text[:start] + text[end:]

          start = text.index("    suspend fun importLegacyStage5IfNeeded(): LegacyImportReport {")
          end = text.index("    suspend fun registerDownloadedDeviceAsset(", start)
          text = text[:start] + text[end:]

          diagnostic = "    suspend fun migrationDiagnostics(): List<MigrationDiagnosticEntity> =\n        dao.migrationDiagnostics()\n\n"
          assert text.count(diagnostic) == 1
          text = text.replace(diagnostic, "", 1)

          for line in (
              '        const val LEGACY_IMPORT_META_KEY = "legacy_stage5_import"\n',
              '        const val LEGACY_IMPORT_VERSION = "1"\n',
          ):
              assert text.count(line) == 1
              text = text.replace(line, "", 1)

          start = text.index("private fun LegacyStage5Candidate.toRecordingEntity")
          end = text.index("private fun AudioAssetEntity.toModel()", start)
          text = text[:start] + text[end:]
          repo.write_text(text)

          dao = Path("core/database/src/main/java/io/github/ioannes78/voica/database/RecordingDao.kt")
          text = dao.read_text()
          start = text.index("    @Insert(onConflict = OnConflictStrategy.REPLACE)\n    suspend fun putMeta(meta: LibraryMetaEntity)")
          end_marker = "    suspend fun migrationDiagnostics(): List<MigrationDiagnosticEntity>\n"
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]
          dao.write_text(text)

          for path in (
              Path("core/database/src/main/java/io/github/ioannes78/voica/database/LegacyStage5Scanner.kt"),
              Path("core/database/src/test/java/io/github/ioannes78/voica/database/LegacyStage5ScannerTest.kt"),
          ):
              assert path.exists(), path
              path.unlink()

          forbidden = (
              "LegacyStage5Scanner",
              "LegacyStage5Candidate",
              "LegacyAssetFormat",
              "LegacyImportReport",
              "importLegacyStage5IfNeeded",
              "migrationDiagnostics()",
              "putMeta(",
              "readMeta(",
              "insertMigrationDiagnostic(",
          )
          leftovers = []
          for base in (Path("app/src/main"), Path("core/database/src/main")):
              for path in base.rglob("*.kt"):
                  content = path.read_text()
                  for token in forbidden:
                      if token in content:
                          leftovers.append(f"{path}: {token}")
          if leftovers:
              raise SystemExit("Unexpected Stage5 legacy references:\n" + "\n".join(leftovers))
          PY
          git diff --check

      - name: Cheap repository contracts
        shell: bash
        run: |
          set -euo pipefail
          bash ci/verify-room-schemas.sh
          grep -Fq 'PRODUCTION_MODEL_CHANNEL_COMMIT' app/src/main/java/io/github/ioannes78/voica/AppModelManager.kt
          if grep -Fq 'voica-model-channel/main/manifests/production.json' app/src/main/java/io/github/ioannes78/voica/AppModelManager.kt; then
            echo "::error::Production model catalog must not track mutable main."
            exit 1
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build and native toolchains
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore pinned Opus 1.6.1 source
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/voica-deps/opus-1.6.1.tar.gz
          key: voica-opus-${{ runner.os }}-1.6.1-6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1

      - name: Prefetch and verify Opus 1.6.1 source
        shell: bash
        run: bash ci/prepare-opus-source.sh

      - name: Unit tests and debug compile gate
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :core:protocol:test \
            :core:ble:testDebugUnitTest \
            :core:database:testDebugUnitTest \
            :core:ai:test \
            :core:audio:test \
            :core:model:test \
            :core:transcript:test \
            :engine:opus:assembleDebug \
            :engine:media:testDebugUnitTest \
            :engine:media:assembleDebug \
            :engine:playback:testDebugUnitTest \
            :engine:playback:assembleDebug \
            :engine:sherpa:testDebugUnitTest \
            :engine:sherpa:assembleDebug \
            :engine:fsmn:testDebugUnitTest \
            :engine:fsmn:assembleDebug \
            :app:testDebugUnitTest \
            --configuration-cache \
            --stacktrace

      - name: Verify FSMN candidate runtime boundary
        shell: bash
        run: bash ci/verify-fsmn-candidate-runtime.sh debug

      - name: Commit verified Stage5 cleanup and restore CI
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/stage5-cleanup.patch"
          git diff --binary -- app core > "$patch"
          test -s "$patch"
          head_ref="${{ github.event.pull_request.head.ref }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          git fetch origin "$head_ref"
          git checkout -B "$head_ref" "$head_sha"
          git apply "$patch"
          git checkout "${head_sha}^" -- .github/workflows/android-ci.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app core .github/workflows/android-ci.yml
          git commit -m "Stage 16 cleanup: remove Stage5 legacy import runtime"
          git push origin "HEAD:$head_ref"

  qa-apk:
    name: QA APK Gate
    if: >-
      ${{
        (github.event_name == 'pull_request' &&
          github.event.action == 'edited' &&
          github.event.changes.title.from != null &&
          startsWith(github.event.pull_request.title, '[APK]')) ||
        (github.event_name == 'workflow_dispatch' && inputs.mode == 'qa')
      }}
    concurrency:
      group: android-ci-qa-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VOICA_BUILD_GIT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cheap repository contracts and version identity
        shell: bash
        run: |
          set -euo pipefail
          bash ci/verify-room-schemas.sh
          version_code="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          release_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$version_code"
          test -n "$release_version"
          echo "VOICA_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          echo "VOICA_RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "VOICA_RELEASEQA_VERSION=${release_version}-export-qa" >> "$GITHUB_ENV"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build and native toolchains
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore pinned Opus 1.6.1 source
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/voica-deps/opus-1.6.1.tar.gz
          key: voica-opus-${{ runner.os }}-1.6.1-6ffcb593207be92584df15b32466ed64bbec99109f007c82205f0194572411a1

      - name: Prefetch and verify Opus 1.6.1 source
        shell: bash
        run: bash ci/prepare-opus-source.sh

      - name: Build production-like QA APK only
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:assembleReleaseQa \
            --configuration-cache \
            --stacktrace

      - name: Verify QA APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/releaseQa/app-releaseQa.apk"
          bash ci/verify-r8-outputs.sh releaseQa
          bash ci/verify-release-artifact.sh \
            "$apk" \
            io.github.ioannes78.voica.qa \
            "$VOICA_VERSION_CODE" \
            "$VOICA_RELEASEQA_VERSION" \
            qa
          bash ci/verify-release-security.sh "$apk"
          bash ci/verify-sherpa-package.sh apk "$apk"

      - name: Upload QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Voica-${{ env.VOICA_RELEASEQA_VERSION }}-apk
          path: app/build/outputs/apk/releaseQa/app-releaseQa.apk
          if-no-files-found: error
          retention-days: 1

name: Android PR CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "engine/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build and native toolchains
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # Temporary Stage 13B.5 QA4 bootstrap: force the exact KSP-generated Room v10
      # schema, commit it to the PR source branch, then remove this bootstrap block.
      - name: Generate Room v10 schema bootstrap
        run: gradle :core:database:kspDebugKotlin --rerun-tasks --stacktrace

      - name: Commit Room v10 schema bootstrap
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          schema="core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/10.json"
          test -f "$schema"

          # pull_request checkout points at the synthetic merge ref. Move to the exact
          # PR source branch before committing so the merge commit is never pushed back.
          git fetch --no-tags origin "${TARGET_BRANCH}"
          git switch --detach "origin/${TARGET_BRANCH}"

          git add -- "$schema"
          if git diff --cached --quiet; then
            echo "Room v10 schema is already committed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "db: add Room v10 schema"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload Room v10 schema bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: Room-v10-schema-bootstrap
          path: core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/10.json
          if-no-files-found: error
          retention-days: 1

      - name: Unit test and debug build
        run: >
          gradle
          :core:protocol:test
          :core:ble:testDebugUnitTest
          :core:database:testDebugUnitTest
          :core:ai:test
          :core:audio:test
          :core:model:test
          :core:transcript:test
          :engine:opus:assembleDebug
          :engine:media:testDebugUnitTest
          :engine:media:assembleDebug
          :engine:playback:testDebugUnitTest
          :engine:playback:assembleDebug
          :engine:sherpa:testDebugUnitTest
          :engine:llm:testDebugUnitTest
          :engine:llm:assembleDebug
          :engine:sherpa:assembleDebug
          :app:testDebugUnitTest
          :app:assembleQa
          --stacktrace

      - name: Verify stable QA signing identity
        shell: bash
        run: |
          expected_cert_sha256="3df9c619ad0d06f2fabb24232420bf056ca2d8ea9413e7f776669a591974f288"
          apk="app/build/outputs/apk/qa/app-qa.apk"
          signer="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -f "$apk"
          actual_cert_sha256="$("$signer" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            tr '[:upper:]' '[:lower:]')"
          test "$actual_cert_sha256" = "$expected_cert_sha256"

      # Stage 13B.5 migration gate: committed Room v1-v9 schemas must stay in sync.
      - name: Verify committed Room schemas
        shell: bash
        run: |
          schema_dir="core/database/schemas"
          for version in 1 2 3 4 5 6 7 8 9; do
            test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/${version}.json"
          done
          git diff --exit-code -- "$schema_dir"
          test -z "$(git status --porcelain --untracked-files=all -- "$schema_dir")"

      # Low-cost default: PR builds do not upload artifacts.
      # Add [APK] to the PR title only when an explicit real-device candidate is needed.
      - name: Upload debug APK
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[APK]'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: Voica-qa-apk
          path: app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error
          retention-days: 3

      # Keep storage bounded during high-frequency device testing:
      # after a new candidate is safely uploaded, remove older APK artifacts
      # from the same source branch. Other branches are left untouched.
      - name: Remove older QA APK artifacts for this branch
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[APK]'))) }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          mapfile -t artifact_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=Voica-qa-apk&per_page=100" \
              --jq ".artifacts[] | select((.workflow_run.head_branch == \"${TARGET_BRANCH}\") and (.workflow_run.id != ${CURRENT_RUN_ID})) | .id"
          )

          if (( ${#artifact_ids[@]} == 0 )); then
            echo "No older Voica-qa-apk artifacts to remove for branch ${TARGET_BRANCH}."
            exit 0
          fi

          for artifact_id in "${artifact_ids[@]}"; do
            echo "Deleting older artifact ${artifact_id} from branch ${TARGET_BRANCH}."
            if ! gh api --silent --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"; then
              echo "::warning::Failed to delete older artifact ${artifact_id}; continuing cleanup."
            fi
          done

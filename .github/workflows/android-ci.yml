name: Android PR CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "engine/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
      - "ci/**"
      - "docs/STAGE_*.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build and native toolchains
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit test and debug build
        run: >
          gradle
          :core:protocol:test
          :core:ble:testDebugUnitTest
          :core:database:testDebugUnitTest
          :core:ai:test
          :core:audio:test
          :core:model:test
          :core:transcript:test
          :engine:opus:assembleDebug
          :engine:media:testDebugUnitTest
          :engine:media:assembleDebug
          :engine:playback:testDebugUnitTest
          :engine:playback:assembleDebug
          :engine:sherpa:testDebugUnitTest
          :engine:llm:testDebugUnitTest
          :engine:llm:assembleDebug
          :engine:sherpa:assembleDebug
          :app:testDebugUnitTest
          :app:assembleQa
          --stacktrace

      - name: Dump generated Room v7 schema on test failure
        if: ${{ failure() }}
        shell: bash
        run: |
          schema="core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/7.json"
          if test -f "$schema"; then
            printf 'ROOM_SCHEMA_V7_GZIP_BASE64='
            gzip -c "$schema" | base64 -w0
            printf '\n'
          else
            echo "ROOM_SCHEMA_V7_MISSING"
          fi

      - name: Verify stable QA signing identity
        shell: bash
        run: |
          expected_cert_sha256="3df9c619ad0d06f2fabb24232420bf056ca2d8ea9413e7f776669a591974f288"
          apk="app/build/outputs/apk/qa/app-qa.apk"
          signer="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -f "$apk"
          actual_cert_sha256="$("$signer" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            tr '[:upper:]' '[:lower:]')"
          test "$actual_cert_sha256" = "$expected_cert_sha256"

      # Stage 12C migration gate: committed Room v1-v6 schemas must stay in sync.
      - name: Verify committed Room schemas
        shell: bash
        run: |
          schema_dir="core/database/schemas"
          test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/1.json"
          test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/2.json"
          test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/3.json"
          test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/4.json"
          test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/5.json"
          test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/6.json"
          git diff --exit-code -- "$schema_dir"
          test -z "$(git status --porcelain --untracked-files=all -- "$schema_dir")"

      # Low-cost default: PR builds do not upload artifacts.
      # Add [APK] to the PR title only when an explicit real-device candidate is needed.
      - name: Upload debug APK
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[APK]'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: Voica-qa-apk
          path: app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error
          retention-days: 3

      # Keep storage bounded during high-frequency device testing:
      # after a new candidate is safely uploaded, remove older APK artifacts
      # from the same source branch. Other branches are left untouched.
      - name: Remove older QA APK artifacts for this branch
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[APK]'))) }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          mapfile -t artifact_ids < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=Voica-qa-apk&per_page=100" \
              --jq ".artifacts[] | select((.workflow_run.head_branch == \"${TARGET_BRANCH}\") and (.workflow_run.id != ${CURRENT_RUN_ID})) | .id"
          )

          if (( ${#artifact_ids[@]} == 0 )); then
            echo "No older Voica-qa-apk artifacts to remove for branch ${TARGET_BRANCH}."
            exit 0
          fi

          for artifact_id in "${artifact_ids[@]}"; do
            echo "Deleting older artifact ${artifact_id} from branch ${TARGET_BRANCH}."
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

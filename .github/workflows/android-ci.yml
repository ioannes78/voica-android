name: Android PR CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "engine/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-ci.yml"
      - "ci/**"
      - "docs/STAGE_*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build and native toolchains
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit test and debug build
        run: >
          gradle
          :core:protocol:test
          :core:ble:testDebugUnitTest
          :core:database:testDebugUnitTest
          :core:audio:test
          :core:model:test
          :core:transcript:test
          :engine:opus:assembleDebug
          :engine:playback:testDebugUnitTest
          :engine:playback:assembleDebug
          :engine:sherpa:testDebugUnitTest
          :engine:sherpa:assembleDebug
          :app:testDebugUnitTest
          :app:assembleQa
          --stacktrace

      - name: Stage 9 schema diagnostic
        if: ${{ always() }}
        shell: bash
        run: |
          schema="core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/3.json"
          if test -f "$schema"; then
            echo "STAGE9_ROOM_SCHEMA_BEGIN"
            cat "$schema"
            echo "STAGE9_ROOM_SCHEMA_END"
          else
            echo "Stage 9 Room schema was not generated"
          fi

      - name: Verify stable QA signing identity
        shell: bash
        run: |
          expected_cert_sha256="3df9c619ad0d06f2fabb24232420bf056ca2d8ea9413e7f776669a591974f288"
          apk="app/build/outputs/apk/qa/app-qa.apk"
          signer="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"

          test -f "$apk"
          actual_cert_sha256="$("$signer" verify --print-certs "$apk" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
            tr '[:upper:]' '[:lower:]')"
          test "$actual_cert_sha256" = "$expected_cert_sha256"

      # Stage 8 migration gate: committed Room v1/v2 schemas must stay in sync.
      - name: Verify committed Room schemas
        shell: bash
        run: |
          schema_dir="core/database/schemas"
          test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/1.json"
          test -f "$schema_dir/io.github.ioannes78.voica.database.VoicaDatabase/2.json"
          git diff --exit-code -- "$schema_dir"
          test -z "$(git status --porcelain --untracked-files=all -- "$schema_dir")"

      # Low-cost default: PR builds do not upload artifacts.
      # Add [APK] to the PR title only when an explicit real-device candidate is needed.
      - name: Upload debug APK
        if: ${{ success() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[APK]'))) }}
        uses: actions/upload-artifact@v4
        with:
          name: Voica-qa-apk
          path: app/build/outputs/apk/qa/app-qa.apk
          if-no-files-found: error
          retention-days: 3

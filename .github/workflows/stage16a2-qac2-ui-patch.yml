name: Stage16A2 QA-C2 UI patch

on:
  push:
    branches:
      - stage16a2-timeline-annotation
    paths:
      - .github/workflows/stage16a2-qac2-ui-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage16a2-timeline-annotation
          fetch-depth: 0

      - name: Apply QA-C2 UI consolidation
        run: python3 tools/stage16a2_qac2_patch.py

      - name: Commit QA-C2 UI consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage16a2-qac2-ui-patch.yml tools/stage16a2_qac2_patch.py
          git add app/src/main/java app/src/test/java
          git diff --cached --check
          git commit -m "fix(stage16a2): consolidate transcript annotation UX"
          git push origin HEAD:stage16a2-timeline-annotation

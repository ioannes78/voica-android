name: Room v16 Schema Capture

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - "core/database/**"
      - ".github/workflows/room-v16-schema-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    name: Capture Room v16 schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Generate Room v16 schema
        shell: bash
        run: |
          set -euo pipefail
          schema="core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/16.json"
          rm -f "$schema"
          gradle :core:database:kspDebugKotlin --rerun-tasks --no-configuration-cache --stacktrace
          test -f "$schema"
          grep -Fq '"version": 16' "$schema"
          grep -Fq '"identityHash": "d9091074b0654977cb0db055dcb35dcd"' "$schema"

      - name: Upload Room v16 schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schema-v16
          path: core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/16.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit compiler-generated v16 schema baseline
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${HEAD_BRANCH}" | awk '{print $1}')"
          if [ "$remote_head" != "$EXPECTED_HEAD" ]; then
            echo "::error::PR head moved during schema capture: expected ${EXPECTED_HEAD}, found ${remote_head}."
            exit 1
          fi

          schema_dir="core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase"
          test -f "${schema_dir}/16.json"
          rm -f "${schema_dir}/15.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${schema_dir}/16.json" "${schema_dir}/15.json"
          git diff --cached --quiet && {
            echo "::error::No Room v16 schema baseline change to commit."
            exit 1
          }
          git commit -m "Stage 16 cleanup: capture Room v16 schema"
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"

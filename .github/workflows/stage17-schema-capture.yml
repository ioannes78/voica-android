name: Stage 17 Room Schema Capture

on:
  pull_request:
    branches: [ main ]
    paths:
      - "core/database/**"
      - ".github/workflows/stage17-schema-capture.yml"

permissions:
  contents: write

jobs:
  capture:
    name: Capture compiler-generated Room v17 schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Generate Room schema
        shell: bash
        run: |
          set -euo pipefail
          gradle :core:database:compileDebugKotlin --stacktrace
          schema="core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/17.json"
          test -f "$schema"
          grep -Fq '"version": 17' "$schema"

      - name: Commit compiler-generated v17 schema
        shell: bash
        run: |
          set -euo pipefail
          schema="core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/17.json"
          git add "$schema"
          if git diff --cached --quiet; then
            echo "Compiler-generated v17 schema is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(stage17.3): capture Room v17 schema"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Upload generated schema
        uses: actions/upload-artifact@v4
        with:
          name: stage17-room17-compiler-schema
          path: core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/17.json
          retention-days: 1
          if-no-files-found: error

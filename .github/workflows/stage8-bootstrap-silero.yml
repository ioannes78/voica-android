name: Stage 8 Bootstrap Silero Baseline

on:
  push:
    branches:
      - stage8-development
    paths:
      - .github/workflows/stage8-bootstrap-silero.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage 8 branch
        uses: actions/checkout@v5
        with:
          ref: stage8-development
          fetch-depth: 0

      - name: Download and verify pinned Silero VAD baseline
        shell: bash
        run: |
          set -euo pipefail
          model_dir="engine/sherpa/src/main/assets/models/silero"
          model_file="$model_dir/silero_vad.int8.onnx"
          mkdir -p "$model_dir"

          curl --fail --location --retry 3 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.int8.onnx" \
            --output "$model_file"

          test "$(stat -c '%s' "$model_file")" = "212860"
          echo "c36d490aff5ab924ca6c7aeec4d8f6bd3d22db6fa17611b9c5b17eae58ac3a20  $model_file" \
            | sha256sum --check --strict

          cat > "$model_dir/PROVENANCE.json" <<'JSON'
          {
            "modelId": "silero-vad-int8",
            "file": "silero_vad.int8.onnx",
            "sourceProject": "k2-fsa/sherpa-onnx",
            "sourceReleaseTag": "asr-models",
            "sourceAssetId": 271935990,
            "sourceUrl": "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.int8.onnx",
            "sourceAssetUpdatedAt": "2025-07-11T07:04:39Z",
            "sizeBytes": 212860,
            "sha256": "c36d490aff5ab924ca6c7aeec4d8f6bd3d22db6fa17611b9c5b17eae58ac3a20",
            "sampleRateHz": 16000,
            "quantization": "int8",
            "licenseId": "MIT",
            "upstreamProject": "snakers4/silero-vad"
          }
          JSON

      - name: Commit verified baseline and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm ".github/workflows/stage8-bootstrap-silero.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "engine/sherpa/src/main/assets/models/silero/silero_vad.int8.onnx" \
            "engine/sherpa/src/main/assets/models/silero/PROVENANCE.json" \
            ".github/workflows/stage8-bootstrap-silero.yml"
          git commit -m "Stage 8H: vendor pinned Silero VAD baseline"
          git push origin HEAD:stage8-development

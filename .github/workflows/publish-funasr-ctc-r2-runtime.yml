name: Publish FunASR CTC Revision 2 Sherpa Runtime

on:
  push:
    branches: [ stage17-fully-offline-intelligence ]
    paths:
      - ".github/workflows/publish-funasr-ctc-r2-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-funasr-ctc-r2-runtime
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SHERPA_UPSTREAM_TAG: v1.13.8
      RUNTIME_VERSION: v1.13.8-p5-ctc-r2
      RELEASE_TAG: runtime-sherpa-funasr-ctc-r2
      ASSET_NAME: sherpa-onnx-v1.13.8-p5-ctc-r2.aar

    steps:
      - name: Checkout current WENZHI sources
        uses: actions/checkout@v5

      - name: Checkout pinned sherpa-onnx v1.13.8
        uses: actions/checkout@v5
        with:
          repository: k2-fsa/sherpa-onnx
          ref: v1.13.8
          path: sherpa-upstream

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build and native toolchains
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-34" \
            "platforms;android-37.1" \
            "build-tools;34.0.0" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Verify immutable upstream runtime pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C sherpa-upstream describe --tags --exact-match HEAD)" = "$SHERPA_UPSTREAM_TAG"
          grep -Fq 'onnxruntime_version=${SHERPA_ONNX_ONNXRUNTIME_VERSION:-1.28.2}' sherpa-upstream/build-android-arm64-v8a.sh
          grep -Fq 'var hotwords: String = ""' sherpa-upstream/android/SherpaOnnxAar/sherpa_onnx/src/main/java/com/k2fsa/sherpa/onnx/OfflineRecognizer.kt

      - name: Apply accepted Stage 16B revision-2 native CTC patches
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/funasr-ctc-runtime/apply-a0-config-patch.py sherpa-upstream
          python3 ci/funasr-ctc-runtime/apply-a1-shared-encoder-patch.py sherpa-upstream
          python3 ci/funasr-ctc-runtime/apply-a2-compact-ctc-patch.py sherpa-upstream
          git -C sherpa-upstream diff --check

      - name: Build patched arm64 JNI with ORT 1.28.2
        shell: bash
        working-directory: sherpa-upstream
        env:
          BUILD_SHARED_LIBS: ON
          SHERPA_ONNX_ONNXRUNTIME_VERSION: "1.28.2"
          SHERPA_ONNX_ENABLE_TTS: OFF
          SHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION: ON
          SHERPA_ONNX_ENABLE_BINARY: OFF
          SHERPA_ONNX_ENABLE_C_API: OFF
          SHERPA_ONNX_ENABLE_JNI: ON
          SHERPA_ONNX_ANDROID_PLATFORM: android-21
        run: |
          set -euo pipefail
          export ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          bash build-android-arm64-v8a.sh
          test -s build-android-arm64-v8a/install/lib/libsherpa-onnx-jni.so
          test -s build-android-arm64-v8a/install/lib/libonnxruntime.so

      - name: Package and verify immutable patched AAR
        shell: bash
        working-directory: sherpa-upstream
        run: |
          set -euo pipefail
          jni_root="android/SherpaOnnxAar/sherpa_onnx/src/main/jniLibs"
          find "$jni_root" -mindepth 1 -maxdepth 1 -type d ! -name arm64-v8a -exec rm -rf {} +
          jni_dir="$jni_root/arm64-v8a"
          mkdir -p "$jni_dir"
          rm -f "$jni_dir/libsherpa-onnx-jni.so" "$jni_dir/libonnxruntime.so"
          cp build-android-arm64-v8a/install/lib/libsherpa-onnx-jni.so "$jni_dir/"
          cp build-android-arm64-v8a/install/lib/libonnxruntime.so "$jni_dir/"
          cd android/SherpaOnnxAar
          ./gradlew :sherpa_onnx:assembleRelease --no-daemon
          aar="$PWD/sherpa_onnx/build/outputs/aar/sherpa_onnx-release.aar"
          test -s "$aar"
          cp "$aar" "$GITHUB_WORKSPACE/$ASSET_NAME"

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          unzip -p "$aar" classes.jar > "$work/classes.jar"
          javap -classpath "$work/classes.jar" com.k2fsa.sherpa.onnx.OfflineFunAsrNanoModelConfig > "$work/config.txt"
          grep -Fq 'getCtcCompact' "$work/config.txt"
          grep -Fq 'setCtcCompact' "$work/config.txt"
          unzip -p "$aar" jni/arm64-v8a/libsherpa-onnx-jni.so > "$work/jni.so"
          strings "$work/jni.so" | grep -Fq 'voica.funasr.ctc.command'
          strings "$work/jni.so" | grep -Fq 'voica.funasr.ctc.target_ids'
          strings "$work/jni.so" | grep -Fq 'candidate_logits'
          strings "$work/jni.so" | grep -Fq 'ForwardCompactCtc'
          nm -D "$work/jni.so" | grep -Fq 'Java_com_k2fsa_sherpa_onnx_OfflineSpeakerDiarization_newFromFile'
          nm -D "$work/jni.so" | grep -Fq 'Java_com_k2fsa_sherpa_onnx_OfflineSpeakerDiarization_process'
          sha256sum "$GITHUB_WORKSPACE/$ASSET_NAME" | tee "$GITHUB_WORKSPACE/$ASSET_NAME.sha256"

      - name: Publish immutable public runtime release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=("$ASSET_NAME" "$ASSET_NAME.sha256")
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)"
            echo "Runtime release already exists at target: $existing"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "WENZHI Sherpa runtime: FunASR native CTC revision 2" \
              --notes "Immutable arm64 sherpa-onnx $RUNTIME_VERSION runtime promoted from the Stage 16B P5 accepted patch set. Required by production FunASR revision 2."
          fi

name: Stage 1 CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/stage1-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        shell: bash
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Unit test and debug build
        run: gradle :core:protocol:test :app:assembleDebug --stacktrace

      - name: Upload Stage 1 APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Voica-0.1.0-stage1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

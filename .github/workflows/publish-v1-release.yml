name: Publish Voica 1.0.0 Release

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-v1-release.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      RELEASE_TAG: v1.0.0
      RELEASE_TARGET_SHA: 9880e31fd965fd878a27a0cccafb94b7dffba9c1
      ACCEPTED_ARTIFACT_ID: "11671638628"
      ACCEPTED_APK_SHA256: 62c62d4ad93cef3b58a5443181f16d984e397b94785286136e01e163f9f125fe
      RELEASE_APK_NAME: Voica-1.0.0-arm64-v8a.apk

    steps:
      - name: Confirm release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Download accepted production APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/unpacked
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTED_ARTIFACT_ID}/zip" \
            > release/accepted-apk-artifact.zip
          unzip -q release/accepted-apk-artifact.zip -d release/unpacked
          test -f release/unpacked/app-release.apk
          mv release/unpacked/app-release.apk "release/${RELEASE_APK_NAME}"

      - name: Verify exact accepted APK
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            "$ACCEPTED_APK_SHA256" \
            "release/${RELEASE_APK_NAME}" | sha256sum -c -
          size="$(stat -c '%s' "release/${RELEASE_APK_NAME}")"
          test "$size" = "30651355"

      - name: Write release notes
        shell: bash
        run: |
          cat > release/RELEASE_NOTES.md <<'EOF'
          ## Voica 1.0.0

          Voica 首个正式发布版本，面向 QS668 / CB08 AI 录音卡。

          ### 主要能力

          - QS668 / CB08 BLE 连接、设备状态与录音控制
          - 设备录音列表、下载与删除
          - 本地录音库与多格式音频导入
          - 波形播放、倍速与转写时间轴同步
          - SenseVoice INT8 / Qwen3-ASR 0.6B INT8 本地文件转写
          - Pyannote Segmentation + CAM++ 说话人分离
          - 转写 / AI 总结版本管理、人工编辑与全文搜索
          - 多 Provider AI 总结
          - 长任务后台执行、恢复与通知

          ### 发布验证

          - versionCode: `88`
          - versionName: `1.0.0`
          - ABI: `arm64-v8a`
          - Android: `8.0+`
          - APK SHA-256: `62c62d4ad93cef3b58a5443181f16d984e397b94785286136e01e163f9f125fe`
          - Production certificate SHA-256: `f972e0b4f37a528a7e667af888f68e0b9470a6dd74e32b865a9d1507554d25e7`

          Stage 14 已完成 30 / 60 / 120 分钟真实长录音稳定性验证，并通过最终 1.0.0 正式签名 APK 真机冒烟测试。

          > 本 Release 上传的是已经完成上述验收的同一份正式签名 APK，不重新编译。
          EOF

      - name: Create GitHub Release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_TARGET_SHA" \
            --title "Voica 1.0.0" \
            --notes-file release/RELEASE_NOTES.md \
            --latest \
            "release/${RELEASE_APK_NAME}#Voica 1.0.0 Android APK (arm64-v8a)"

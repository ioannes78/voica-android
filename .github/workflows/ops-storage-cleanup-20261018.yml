name: One-time approved QA artifact cleanup

'on':
  push:
    branches: [ops/actions-storage-cleanup-20261018]
    paths: [.github/workflows/ops-storage-cleanup-20261018.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: ops-storage-cleanup-20261018
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'ioannes78/voica-android' && github.ref == 'refs/heads/ops/actions-storage-cleanup-20261018'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Delete only the 37 user-approved old QA artifacts and verify all preserved artifacts

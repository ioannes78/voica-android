          PLAN = json.loads("[{\"id\":12125373884,\"run\":39098227124,\"name\":\"Voica-1.1.0-stage16a2-export-qa-apk\",\"bytes\":31081786,\"branch\":\"stage16a2-timeline-annotation\",\"sha\":\"c813dc7f6c653cc09498c9079a089d6cb2de96fa\",\"digest\":\"sha256:5329f7e9d43a5f985a635e7f369a1c549ad3370866743b1059f6e64b97c91fbc\"},{\"id\":12125487255,\"run\":39097655277,\"name\":\"Voica-1.1.0-stage16a2-export-qa-apk\",\"bytes\":31081786,\"branch\":\"stage16a2-timeline-annotation\",\"sha\":\"fc08aeb5207c85df83e2e3df1f956a74a70dfc78\",\"digest\":\"sha256:1e54f3b476513382eb89eb46cd187df312f0ca4228233191d3a1f325aca185b6\"},{\"id\":12123529297,\"run\":39095300240,\"name\":\"Voica-1.1.0-stage16a2-export-qa-apk\",\"bytes\":31081786,\"branch\":\"stage16a2-timeline-annotation\",\"sha\":\"12f9cb5690b79d628034d59de76e14179d047ba2\",\"digest\":\"sha256:9ec415e3c1c4c4e0c74a693f32849d5d8c137b294ae70e7e994f55bb6738aba3\"},{\"id\":12123824407,\"run\":39094838181,\"name\":\"Voica-1.1.0-stage16a2-export-qa-apk\",\"bytes\":31081786,\"branch\":\"stage16a2-timeline-annotation\",\"sha\":\"c06e00f250b89d1afb5c25b4f7e388a6105e1d2e\",\"digest\":\"sha256:7a5527e0a7a6d9ba8de74774ed4211ffcb7d0cf0c14290102d47827cbf304076\"},{\"id\":12124450097,\"run\":39093711572,\"name\":\"Voica-1.1.0-stage16a2-export-qa-apk\",\"bytes\":31049018,\"branch\":\"stage16a2-timeline-annotation\",\"sha\":\"80d87a658900ef1f98a07c8fc123d63c4b67b77c\",\"digest\":\"sha256:cd6a0711fa1711f72d0a6f335bb244bafe39d8f8a7ffe66bcc9614146ee5a079\"},{\"id\":12122829711,\"run\":39093291873,\"name\":\"Voica-1.1.0-stage16a2-export-qa-apk\",\"bytes\":31049018,\"branch\":\"stage16a2-timeline-annotation\",\"sha\":\"7f20e8cdb59e48e0de440caaf556d27661b663f6\",\"digest\":\"sha256:a448f223632ca4b8fb46d7fab7ff6e8217700d8b03080f3857ce970cd163d01a\"},{\"id\":12106328105,\"run\":39047297487,\"name\":\"Voica-1.1.0-stage16a-export-qa-apk\",\"bytes\":31044476,\"branch\":\"stage16a1_6-android-audio-io-compatibility\",\"sha\":\"761322fe836da1d8863611746b59ffc
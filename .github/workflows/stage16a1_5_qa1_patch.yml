name: Stage16A1-5-QA1-Patch

on:
  push:
    branches:
      - stage16a1_5-home-notification-ux

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch presentation wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          screen = Path('app/src/main/java/io/github/ioannes78/voica/ui/device/DeviceProductScreen.kt')
          source = screen.read_text(encoding='utf-8')
          needle = 'DeviceHeader(\n                            connected = recorderAvailable,'
          replacement = 'VoicaBrandHeader(\n                            connected = recorderAvailable,'
          if needle not in source:
              raise SystemExit('expected DeviceHeader call not found')
          screen.write_text(source.replace(needle, replacement, 1), encoding='utf-8')

          changed = []
          for path in Path('app/src/main/java').rglob('*.kt'):
              source = path.read_text(encoding='utf-8')
              if '.setSmallIcon(' not in source:
                  continue
              updated = re.sub(r'\.setSmallIcon\([^\r\n]*\)', '.setSmallIcon(R.drawable.ic_voica_notification)', source)
              if updated == source:
                  continue
              package_line = updated.splitlines()[0]
              if package_line != 'package io.github.ioannes78.voica' and 'import io.github.ioannes78.voica.R' not in updated:
                  updated = updated.replace(package_line + '\n', package_line + '\n\nimport io.github.ioannes78.voica.R\n', 1)
              path.write_text(updated, encoding='utf-8')
              changed.append(str(path))

          if not changed:
              raise SystemExit('no production notification icons were replaced')
          print('updated notification files:')
          for path in changed:
              print(path)
          PY

          rm .github/workflows/stage16a1_5_qa1_patch.yml
          git config user.name "ioannes78"
          git config user.email "70731599+ioannes78@users.noreply.github.com"
          git add app/src/main/java .github/workflows/stage16a1_5_qa1_patch.yml
          git commit -m "feat: wire qa1 brand header and notification icon"
          git push origin HEAD:stage16a1_5-home-notification-ux

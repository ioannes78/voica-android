name: Stage 16A.2 Wire Waveform Markers

on:
  push:
    branches: [stage16a2-timeline-annotation]
    paths:
      - '.github/workflows/stage16a2-wire-waveform-markers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage branch
        uses: actions/checkout@v5
        with:
          ref: stage16a2-timeline-annotation
          fetch-depth: 0
      - name: Patch waveform and detail wiring
        shell: python
        run: |
          from pathlib import Path

          def one(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return source.replace(old, new, 1)

          playback = Path('app/src/main/java/io/github/ioannes78/voica/ui/playback/PlaybackCard.kt')
          s = playback.read_text()
          s = one(s,
              '    onRetry: () -> Unit,\n    waveform: WaveformOverviewResult = WaveformOverviewResult.Unavailable,\n) {',
              '    onRetry: () -> Unit,\n    waveform: WaveformOverviewResult = WaveformOverviewResult.Unavailable,\n    annotationSampleIndices: List<Long> = emptyList(),\n    onWaveformLongPress: ((Long) -> Unit)? = null,\n) {',
              'PlaybackCard signature')
          s = one(s,
              '    val controlsEnabled =\n        snapshot.state !in',
              '    val annotationMarkerProgress =\n        if (totalSamples > 0L) {\n            annotationSampleIndices\n                .asSequence()\n                .filter { it in 0L..totalSamples }\n                .distinct()\n                .map { sample ->\n                    (sample.toDouble() / totalSamples.toDouble())\n                        .coerceIn(0.0, 1.0)\n                        .toFloat()\n                }\n                .toList()\n        } else {\n            emptyList()\n        }\n    val controlsEnabled =\n        snapshot.state !in',
              'marker progress')
          s = one(s,
              '                    onTapSeek = { ratio ->\n                        onSeek(\n                            (ratio * totalSamples.toDouble())\n                                .roundToLong()\n                                .coerceIn(0L, totalSamples),\n                        )\n                    },\n                )',
              '                    onTapSeek = { ratio ->\n                        onSeek(\n                            (ratio * totalSamples.toDouble())\n                                .roundToLong()\n                                .coerceIn(0L, totalSamples),\n                        )\n                    },\n                    markerProgress = annotationMarkerProgress,\n                    onLongPress =\n                        onWaveformLongPress?.let { callback ->\n                            { ratio ->\n                                callback(\n                                    (ratio * totalSamples.toDouble())\n                                        .roundToLong()\n                                        .coerceIn(0L, totalSamples),\n                                )\n                            }\n                        },\n                )',
              'waveform call')
          s = one(s,
              '    onCommit: () -> Unit,\n    onTapSeek: (Double) -> Unit,\n) {\n    val playedColor = MaterialTheme.colorScheme.primary\n    val remainingColor = MaterialTheme.colorScheme.outlineVariant',
              '    onCommit: () -> Unit,\n    onTapSeek: (Double) -> Unit,\n    markerProgress: List<Float> = emptyList(),\n    onLongPress: ((Double) -> Unit)? = null,\n) {\n    val playedColor = MaterialTheme.colorScheme.primary\n    val remainingColor = MaterialTheme.colorScheme.outlineVariant\n    val markerColor = MaterialTheme.colorScheme.tertiary',
              'WaveformSeekOverview signature')
          s = one(s,
              '                    detectTapGestures { offset ->\n                        onTapSeek((offset.x / size.width.toFloat()).coerceIn(0f, 1f).toDouble())\n                    }',
              '                    detectTapGestures(\n                        onTap = { offset ->\n                            if (size.width > 0) {\n                                onTapSeek((offset.x / size.width.toFloat()).coerceIn(0f, 1f).toDouble())\n                            }\n                        },\n                        onLongPress = { offset ->\n                            if (size.width > 0) {\n                                onLongPress?.invoke(\n                                    (offset.x / size.width.toFloat()).coerceIn(0f, 1f).toDouble(),\n                                )\n                            }\n                        },\n                    )',
              'waveform gestures')
          s = one(s,
              '        amplitudes.forEachIndexed { index, value ->\n            val x = step * (index + 0.5f)\n            val halfHeight = value.coerceIn(0.05f, 1f) * size.height * 0.45f\n            drawLine(\n                color = if (x <= progressX) playedColor else remainingColor,\n                start = Offset(x, centerY - halfHeight),\n                end = Offset(x, centerY + halfHeight),\n                strokeWidth = (step * 0.48f).coerceIn(2f, 7f),\n                cap = StrokeCap.Round,\n            )\n        }',
              '        amplitudes.forEachIndexed { index, value ->\n            val x = step * (index + 0.5f)\n            val halfHeight = value.coerceIn(0.05f, 1f) * size.height * 0.45f\n            drawLine(\n                color = if (x <= progressX) playedColor else remainingColor,\n                start = Offset(x, centerY - halfHeight),\n                end = Offset(x, centerY + halfHeight),\n                strokeWidth = (step * 0.48f).coerceIn(2f, 7f),\n                cap = StrokeCap.Round,\n            )\n        }\n        markerProgress.forEach { ratio ->\n            val x = ratio.coerceIn(0f, 1f) * size.width\n            drawLine(\n                color = markerColor.copy(alpha = 0.78f),\n                start = Offset(x, 5f),\n                end = Offset(x, size.height - 5f),\n                strokeWidth = 2f,\n                cap = StrokeCap.Round,\n            )\n            drawCircle(\n                color = markerColor,\n                radius = 4f,\n                center = Offset(x, 6f),\n            )\n        }',
              'marker drawing')
          playback.write_text(s)

          controls = Path('app/src/main/java/io/github/ioannes78/voica/ui/playback/RecordingPlaybackControls.kt')
          s = controls.read_text()
          s = one(s,
              '    playbackViewModel: PlaybackViewModel,\n    onGenerateCanonical: () -> Unit,\n    onCancelCanonical: () -> Unit,\n) {',
              '    playbackViewModel: PlaybackViewModel,\n    annotationSampleIndices: List<Long> = emptyList(),\n    onWaveformLongPress: ((Long) -> Unit)? = null,\n    onGenerateCanonical: () -> Unit,\n    onCancelCanonical: () -> Unit,\n) {',
              'RecordingPlaybackCard signature')
          s = one(s,
              '                onRetry = playbackViewModel::retryCurrent,\n                waveform = waveform,\n            )',
              '                onRetry = playbackViewModel::retryCurrent,\n                waveform = waveform,\n                annotationSampleIndices = annotationSampleIndices,\n                onWaveformLongPress = onWaveformLongPress,\n            )',
              'RecordingPlaybackCard pass-through')
          controls.write_text(s)

          screen = Path('app/src/main/java/io/github/ioannes78/voica/ui/library/RecordingDetailProductScreen.kt')
          s = screen.read_text()
          s = one(s,
              'import io.github.ioannes78.voica.database.TranscriptionEntity\n',
              'import io.github.ioannes78.voica.database.TimelineAnnotationAnchorDomainValue\nimport io.github.ioannes78.voica.database.TranscriptionEntity\n',
              'annotation domain import')
          s = one(s,
              '    val playbackSnapshot by playbackViewModel.snapshot.collectAsState()\n\n    val visibleTranscriptionCandidateId =',
              '    val playbackSnapshot by playbackViewModel.snapshot.collectAsState()\n    val annotationUiState by annotationViewModel.state.collectAsState()\n    val waveformAnnotationSamples =\n        annotationUiState.items\n            .asSequence()\n            .map { it.annotation }\n            .filter { annotation ->\n                annotation.recordingId == recording.id &&\n                    annotation.anchorDomain == TimelineAnnotationAnchorDomainValue.CANONICAL_RECORDING\n            }\n            .map { it.anchorSampleIndex }\n            .distinct()\n            .sorted()\n            .toList()\n\n    val visibleTranscriptionCandidateId =',
              'annotation state collection')
          s = one(s,
              '                                playbackViewModel = playbackViewModel,\n                                onGenerateCanonical = { onGenerateCanonical(recording.id) },',
              '                                playbackViewModel = playbackViewModel,\n                                annotationSampleIndices = waveformAnnotationSamples,\n                                onWaveformLongPress = { sampleIndex ->\n                                    annotationViewModel.createAtSample(\n                                        recording = recording,\n                                        playback = playbackSnapshot,\n                                        sampleIndex = sampleIndex,\n                                    )\n                                },\n                                onGenerateCanonical = { onGenerateCanonical(recording.id) },',
              'player annotation wiring')
          screen.write_text(s)
      - name: Commit patch and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage16a2-wire-waveform-markers.yml
          git add app/src/main/java/io/github/ioannes78/voica/ui/playback/PlaybackCard.kt
          git add app/src/main/java/io/github/ioannes78/voica/ui/playback/RecordingPlaybackControls.kt
          git add app/src/main/java/io/github/ioannes78/voica/ui/library/RecordingDetailProductScreen.kt
          git commit -m 'feat(annotation): add waveform point markers'
          git push origin HEAD:stage16a2-timeline-annotation

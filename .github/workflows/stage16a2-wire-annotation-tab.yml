name: Stage 16A2 Wire Annotation Tab

on:
  push:
    branches:
      - stage16a2-timeline-annotation
    paths:
      - .github/workflows/stage16a2-wire-annotation-tab.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: stage16a2-timeline-annotation
          fetch-depth: 0
      - name: Patch product screen
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/io/github/ioannes78/voica/ui/library/RecordingDetailProductScreen.kt')
          s = p.read_text()
          def one(a, b, label):
              global s
              n = s.count(a)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(a, b, 1)

          one('import io.github.ioannes78.voica.ui.ai.AiSummaryViewModel\n',
              'import io.github.ioannes78.voica.ui.ai.AiSummaryViewModel\nimport io.github.ioannes78.voica.ui.annotation.TimelineAnnotationPanel\nimport io.github.ioannes78.voica.ui.annotation.TimelineAnnotationViewModel\n', 'imports-a')
          one('import io.github.ioannes78.voica.ui.playback.PlaybackViewModel\n',
              'import io.github.ioannes78.voica.ui.playback.PlaybackViewModel\nimport io.github.ioannes78.voica.ui.playback.TimelineAnnotationPlaybackCoordinator\n', 'imports-b')
          one('private enum class ProductDetailTab {\n    RECORDING,\n    TRANSCRIPT,\n    SUMMARY,\n}',
              'private enum class ProductDetailTab {\n    RECORDING,\n    TRANSCRIPT,\n    SUMMARY,\n    ANNOTATIONS,\n}', 'enum')

          old = '    val application = LocalContext.current.applicationContext as VoicaApplication\n    val speakerModeStore = remember(application) { RecordingSpeakerModeStore(application) }'
          new = '''    val application = LocalContext.current.applicationContext as VoicaApplication
              val annotationPlaybackCoordinator =
                  remember(
                      application.container.playbackController,
                      application.container.timelineAnnotationAnchorResolver,
                  ) {
                      TimelineAnnotationPlaybackCoordinator(
                          controller = application.container.playbackController,
                          resolver = application.container.timelineAnnotationAnchorResolver,
                      )
                  }
              val annotationViewModel: TimelineAnnotationViewModel =
                  viewModel(
                      factory =
                          remember(
                              application.container.timelineAnnotationRepository,
                              annotationPlaybackCoordinator,
                              application.container.timelineAnnotationAttachmentStore,
                              application.container.timelineAnnotationContentCoordinator,
                          ) {
                              TimelineAnnotationViewModel.Factory(
                                  repository = application.container.timelineAnnotationRepository,
                                  playbackCoordinator = annotationPlaybackCoordinator,
                                  attachmentStore = application.container.timelineAnnotationAttachmentStore,
                                  contentCoordinator = application.container.timelineAnnotationContentCoordinator,
                              )
                          },
                  )
              val speakerModeStore = remember(application) { RecordingSpeakerModeStore(application) }'''
          new = '\n'.join(line[4:] if line.startswith('    ') else line for line in new.splitlines())
          one(old, new, 'vm')

          one('        qa4LifecycleViewModel.bind(recording.id)\n    }',
              '        qa4LifecycleViewModel.bind(recording.id)\n        annotationViewModel.bind(recording.id)\n    }', 'bind')
          one('                                ProductDetailTab.SUMMARY -> "总结"\n',
              '                                ProductDetailTab.SUMMARY -> "总结"\n                                ProductDetailTab.ANNOTATIONS -> "标注"\n', 'label')
          one('            ProductDetailTab.RECORDING -> Unit\n        }\n\n        Box(',
              '            ProductDetailTab.ANNOTATIONS -> Unit\n            ProductDetailTab.RECORDING -> Unit\n        }\n\n        Box(', 'header')

          marker = '''                ProductDetailTab.SUMMARY ->
                        LazyColumn('''
          if s.count(marker) != 1:
              raise SystemExit(f'summary content marker: {s.count(marker)}')
          # Add ANNOTATIONS branch immediately before the closing content-when sequence, using the unique tail before speaker sheet.
          tail = '''                    }
                }
            }
        }
    }

    if (speakerSheetOpen) {'''
          replacement = '''                    }

                ProductDetailTab.ANNOTATIONS ->
                    TimelineAnnotationPanel(
                        recording = recording,
                        playback = playbackSnapshot,
                        viewModel = annotationViewModel,
                    )
            }
        }
    }

    if (speakerSheetOpen) {'''
          one(tail, replacement, 'content')
          one('Text("将删除手机中的录音、标准音频、转写、说话人结果和总结；不会删除录音卡中的文件。")',
              'Text("将删除手机中的录音、标准音频、转写、说话人结果、标注和总结；不会删除录音卡中的文件。")', 'delete-copy')
          one('        RecordingDetailDestination.SUMMARY -> ProductDetailTab.SUMMARY\n',
              '        RecordingDetailDestination.SUMMARY -> ProductDetailTab.SUMMARY\n        RecordingDetailDestination.ANNOTATIONS -> ProductDetailTab.ANNOTATIONS\n', 'to-tab')
          one('        ProductDetailTab.SUMMARY -> RecordingDetailDestination.SUMMARY\n',
              '        ProductDetailTab.SUMMARY -> RecordingDetailDestination.SUMMARY\n        ProductDetailTab.ANNOTATIONS -> RecordingDetailDestination.ANNOTATIONS\n', 'to-destination')
          p.write_text(s)
          PY
          python3 /tmp/patch.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/stage16a2-wire-annotation-tab.yml
          git add app/src/main/java/io/github/ioannes78/voica/ui/library/RecordingDetailProductScreen.kt
          git commit -m 'feat(annotation): wire fourth detail tab'
          git push origin HEAD:stage16a2-timeline-annotation

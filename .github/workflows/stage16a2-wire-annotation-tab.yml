name: Stage 16A.2 Wire Annotation Tab

on:
  push:
    branches: [stage16a2-timeline-annotation]
    paths:
      - '.github/workflows/stage16a2-wire-annotation-tab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage branch
        uses: actions/checkout@v5
        with:
          ref: stage16a2-timeline-annotation
          fetch-depth: 0
      - name: Patch recording detail product screen
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/io/github/ioannes78/voica/ui/library/RecordingDetailProductScreen.kt')
          source = path.read_text()
          def one(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              source = source.replace(old, new, 1)
          one('import io.github.ioannes78.voica.ui.ai.AiSummaryViewModel\n', 'import io.github.ioannes78.voica.ui.ai.AiSummaryViewModel\nimport io.github.ioannes78.voica.ui.annotation.TimelineAnnotationPanel\nimport io.github.ioannes78.voica.ui.annotation.TimelineAnnotationViewModel\n', 'annotation imports')
          one('import io.github.ioannes78.voica.ui.playback.PlaybackViewModel\n', 'import io.github.ioannes78.voica.ui.playback.PlaybackViewModel\nimport io.github.ioannes78.voica.ui.playback.TimelineAnnotationPlaybackCoordinator\n', 'playback import')
          one('private enum class ProductDetailTab {\n    RECORDING,\n    TRANSCRIPT,\n    SUMMARY,\n}', 'private enum class ProductDetailTab {\n    RECORDING,\n    TRANSCRIPT,\n    SUMMARY,\n    ANNOTATIONS,\n}', 'tab enum')
          old_vm = '    val application = LocalContext.current.applicationContext as VoicaApplication\n    val speakerModeStore = remember(application) { RecordingSpeakerModeStore(application) }'
          new_vm = ('    val application = LocalContext.current.applicationContext as VoicaApplication\n'
              '    val annotationPlaybackCoordinator =\n'
              '        remember(\n'
              '            application.container.playbackController,\n'
              '            application.container.timelineAnnotationAnchorResolver,\n'
              '        ) {\n'
              '            TimelineAnnotationPlaybackCoordinator(\n'
              '                controller = application.container.playbackController,\n'
              '                resolver = application.container.timelineAnnotationAnchorResolver,\n'
              '            )\n'
              '        }\n'
              '    val annotationViewModel: TimelineAnnotationViewModel =\n'
              '        viewModel(\n'
              '            factory =\n'
              '                remember(\n'
              '                    application.container.timelineAnnotationRepository,\n'
              '                    annotationPlaybackCoordinator,\n'
              '                    application.container.timelineAnnotationAttachmentStore,\n'
              '                    application.container.timelineAnnotationContentCoordinator,\n'
              '                ) {\n'
              '                    TimelineAnnotationViewModel.Factory(\n'
              '                        repository = application.container.timelineAnnotationRepository,\n'
              '                        playbackCoordinator = annotationPlaybackCoordinator,\n'
              '                        attachmentStore = application.container.timelineAnnotationAttachmentStore,\n'
              '                        contentCoordinator = application.container.timelineAnnotationContentCoordinator,\n'
              '                    )\n'
              '                },\n'
              '        )\n'
              '    val speakerModeStore = remember(application) { RecordingSpeakerModeStore(application) }')
          one(old_vm, new_vm, 'viewmodel wiring')
          one('        qa4LifecycleViewModel.bind(recording.id)\n    }', '        qa4LifecycleViewModel.bind(recording.id)\n        annotationViewModel.bind(recording.id)\n    }', 'bind')
          one('                                ProductDetailTab.SUMMARY -> "总结"\n', '                                ProductDetailTab.SUMMARY -> "总结"\n                                ProductDetailTab.ANNOTATIONS -> "标注"\n', 'tab label')
          one('            ProductDetailTab.RECORDING -> Unit\n        }\n\n        Box(', '            ProductDetailTab.ANNOTATIONS -> Unit\n            ProductDetailTab.RECORDING -> Unit\n        }\n\n        Box(', 'header branch')
          old_tail = '                    }\n            }\n        }\n    }\n\n    if (speakerSheetOpen) {'
          new_tail = ('                    }\n\n'
              '                ProductDetailTab.ANNOTATIONS ->\n'
              '                    TimelineAnnotationPanel(\n'
              '                        recording = recording,\n'
              '                        playback = playbackSnapshot,\n'
              '                        viewModel = annotationViewModel,\n'
              '                    )\n'
              '            }\n'
              '        }\n'
              '    }\n\n'
              '    if (speakerSheetOpen) {')
          one(old_tail, new_tail, 'content branch')
          one('Text("将删除手机中的录音、标准音频、转写、说话人结果和总结；不会删除录音卡中的文件。")', 'Text("将删除手机中的录音、标准音频、转写、说话人结果、标注和总结；不会删除录音卡中的文件。")', 'delete copy')
          one('        RecordingDetailDestination.SUMMARY -> ProductDetailTab.SUMMARY\n', '        RecordingDetailDestination.SUMMARY -> ProductDetailTab.SUMMARY\n        RecordingDetailDestination.ANNOTATIONS -> ProductDetailTab.ANNOTATIONS\n', 'destination to tab')
          one('        ProductDetailTab.SUMMARY -> RecordingDetailDestination.SUMMARY\n', '        ProductDetailTab.SUMMARY -> RecordingDetailDestination.SUMMARY\n        ProductDetailTab.ANNOTATIONS -> RecordingDetailDestination.ANNOTATIONS\n', 'tab to destination')
          path.write_text(source)
      - name: Commit patch and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage16a2-wire-annotation-tab.yml
          git add app/src/main/java/io/github/ioannes78/voica/ui/library/RecordingDetailProductScreen.kt
          git commit -m 'feat(annotation): wire fourth detail tab'
          git push origin HEAD:stage16a2-timeline-annotation

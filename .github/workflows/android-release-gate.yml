name: Android Full Release Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - "app/**"
      - "core/**"
      - "engine/**"
      - "ci/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-release-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  VOICA_SOURCE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  VOICA_ACCEPTED_RC_SOURCE_SHA: "c7ccdd77e71daf2f11cb88489bd0b3a0fab3b80b"
  VOICA_VERSION_CODE: "87"
  VOICA_RELEASE_VERSION: "1.0.0-rc3-r2"
  VOICA_RELEASEQA_VERSION: "1.0.0-rc3-r2-export-qa"
  VOICA_MODEL_CHANNEL_COMMIT: "be74c7065ce22a5f9b207a7cf1c88d3be0e872ec"
  VOICA_MODEL_MANIFEST_VERSION: "7"
  VOICA_MODEL_MANIFEST_DIGEST: "8bdb505ce97820cb942bc2855c8a099484b7e22f63ec5567b63f2c1c18d567cf"

jobs:
  full-release-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[APK]') || contains(github.event.pull_request.title, '[RELEASE]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify V1 RC source contract
        shell: bash
        run: bash ci/verify-v1-rc-source-contract.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build and native toolchains
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Prefetch and verify Opus 1.6.1 source
        shell: bash
        run: bash ci/prepare-opus-source.sh

      - name: Build full unsigned Release surface
        shell: bash
        run: |
          set -euo pipefail
          gradle \
            :app:assembleReleaseQa \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-configuration-cache \
            --stacktrace

      - name: Verify R8 outputs
        shell: bash
        run: |
          bash ci/verify-r8-outputs.sh releaseQa
          bash ci/verify-r8-outputs.sh release

      - name: Verify ReleaseQa identity and QA signer
        shell: bash
        run: |
          bash ci/verify-release-artifact.sh \
            app/build/outputs/apk/releaseQa/app-releaseQa.apk \
            io.github.ioannes78.voica.qa \
            "$VOICA_VERSION_CODE" \
            "$VOICA_RELEASEQA_VERSION" \
            qa

      - name: Verify unsigned Release APK identity
        shell: bash
        run: |
          bash ci/verify-release-artifact.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            io.github.ioannes78.voica \
            "$VOICA_VERSION_CODE" \
            "$VOICA_RELEASE_VERSION" \
            unsigned

      - name: Verify Release AAB structure and identity contract
        shell: bash
        run: |
          bash ci/verify-release-aab.sh \
            app/build/outputs/bundle/release/app-release.aab \
            io.github.ioannes78.voica \
            "$VOICA_VERSION_CODE" \
            "$VOICA_RELEASE_VERSION"

      - name: Verify security and model-channel boundary
        shell: bash
        run: |
          bash ci/verify-release-security.sh app/build/outputs/apk/releaseQa/app-releaseQa.apk
          bash ci/verify-release-security.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify Sherpa JNI and native packaging
        shell: bash
        run: |
          bash ci/verify-sherpa-package.sh apk app/build/outputs/apk/releaseQa/app-releaseQa.apk
          bash ci/verify-sherpa-package.sh apk app/build/outputs/apk/release/app-release-unsigned.apk
          bash ci/verify-sherpa-package.sh aab app/build/outputs/bundle/release/app-release.aab

      - name: Verify Room schema provenance
        shell: bash
        run: bash ci/verify-room-schemas.sh

      - name: Verify production signing configuration guardrails
        shell: bash
        run: bash ci/verify-production-signing-config.sh

      - name: Verify production signing artifact boundary
        shell: bash
        run: bash ci/verify-production-signing-boundary.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Generate Release provenance
        shell: bash
        run: |
          bash ci/generate-release-provenance.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/apk/releaseQa/app-releaseQa.apk \
            build/release-provenance.txt

      - name: Upload production-like QA APK
        uses: actions/upload-artifact@v4
        with:
          name: Voica-release-gate-releaseqa-apk
          path: app/build/outputs/apk/releaseQa/app-releaseQa.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload UNSIGNED Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Voica-release-UNSIGNED-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload UNSIGNED Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Voica-release-UNSIGNED-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3

      - name: Upload Release provenance and mappings
        uses: actions/upload-artifact@v4
        with:
          name: Voica-release-provenance
          path: |
            build/release-provenance.txt
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/releaseQa/mapping.txt
          if-no-files-found: error
          retention-days: 7

  production-signing:
    name: Production signing (Stage 14 RC only)
    needs: full-release-gate
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'stage14-v1-release-freeze' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lock production product source to accepted RC
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=20 origin stage14-v1-release-freeze
          git cat-file -e "${VOICA_ACCEPTED_RC_SOURCE_SHA}^{commit}"
          git diff --exit-code "${VOICA_ACCEPTED_RC_SOURCE_SHA}" HEAD -- \
            app \
            core \
            engine \
            gradle \
            gradle.properties \
            gradlew \
            gradlew.bat \
            build.gradle.kts \
            settings.gradle.kts
          echo "Production product source is unchanged from accepted RC ${VOICA_ACCEPTED_RC_SOURCE_SHA}."

      - name: Verify V1 RC source contract
        shell: bash
        run: bash ci/verify-v1-rc-source-contract.sh

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build and native toolchains
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-37.1" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Prefetch and verify Opus 1.6.1 source
        shell: bash
        run: bash ci/prepare-opus-source.sh

      - name: Materialize production keystore in runner temp
        shell: bash
        env:
          VOICA_KEYSTORE_BASE64: ${{ secrets.VOICA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${VOICA_KEYSTORE_BASE64:-}" ]]; then
            echo "Missing GitHub Secret: VOICA_KEYSTORE_BASE64" >&2
            exit 2
          fi
          store="${RUNNER_TEMP}/voica-production.jks"
          umask 077
          printf '%s' "${VOICA_KEYSTORE_BASE64}" | base64 --decode > "${store}"
          test -s "${store}"
          echo "VOICA_RELEASE_STORE_FILE=${store}" >> "${GITHUB_ENV}"

      - name: Validate production secret set and certificate
        shell: bash
        env:
          VOICA_RELEASE_STORE_PASSWORD: ${{ secrets.VOICA_STORE_PASSWORD }}
          VOICA_RELEASE_KEY_ALIAS: ${{ secrets.VOICA_KEY_ALIAS }}
          VOICA_RELEASE_KEY_PASSWORD: ${{ secrets.VOICA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VOICA_RELEASE_STORE_PASSWORD VOICA_RELEASE_KEY_ALIAS VOICA_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required production signing secret for ${name}." >&2
              exit 2
            fi
          done
          LC_ALL=C keytool -list -keystore "${VOICA_RELEASE_STORE_FILE}" \
            -storepass "${VOICA_RELEASE_STORE_PASSWORD}" \
            -alias "${VOICA_RELEASE_KEY_ALIAS}" >/dev/null
          cert_sha256="$(
            LC_ALL=C keytool -list -v -keystore "${VOICA_RELEASE_STORE_FILE}" \
              -storepass "${VOICA_RELEASE_STORE_PASSWORD}" \
              -alias "${VOICA_RELEASE_KEY_ALIAS}" |
              sed -n 's/^[[:space:]]*SHA256: //p' |
              head -n 1 |
              tr '[:upper:]' '[:lower:]' |
              tr -d ':[:space:]'
          )"
          if [[ -z "${cert_sha256}" ]]; then
            echo "Unable to read production certificate SHA-256." >&2
            exit 1
          fi
          if [[ "${cert_sha256}" = "3df9c619ad0d06f2fabb24232420bf056ca2d8ea9413e7f776669a591974f288" ]]; then
            echo "Production certificate must not match the public QA signer." >&2
            exit 1
          fi
          echo "VOICA_EXPECTED_PRODUCTION_CERT_SHA256=${cert_sha256}" >> "${GITHUB_ENV}"
          {
            echo "### Production signer"
            echo
            echo "- certificate SHA-256: \`${cert_sha256}\`"
            echo "- accepted RC source: \`${VOICA_ACCEPTED_RC_SOURCE_SHA}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Build production-signed APK and AAB
        shell: bash
        env:
          VOICA_RELEASE_STORE_PASSWORD: ${{ secrets.VOICA_STORE_PASSWORD }}
          VOICA_RELEASE_KEY_ALIAS: ${{ secrets.VOICA_KEY_ALIAS }}
          VOICA_RELEASE_KEY_PASSWORD: ${{ secrets.VOICA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle \
            :app:verifyProductionSigningConfiguration \
            :app:assembleReleaseQa \
            :app:assembleRelease \
            :app:bundleRelease \
            --no-configuration-cache \
            --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab

      - name: Verify production-signed Release artifacts
        shell: bash
        run: |
          set -euo pipefail
          bash ci/verify-r8-outputs.sh release
          bash ci/verify-release-artifact.sh \
            app/build/outputs/apk/release/app-release.apk \
            io.github.ioannes78.voica \
            "$VOICA_VERSION_CODE" \
            "$VOICA_RELEASE_VERSION" \
            production
          bash ci/verify-release-aab.sh \
            app/build/outputs/bundle/release/app-release.aab \
            io.github.ioannes78.voica \
            "$VOICA_VERSION_CODE" \
            "$VOICA_RELEASE_VERSION"
          bash ci/verify-production-aab-signature.sh \
            app/build/outputs/bundle/release/app-release.aab \
            "$VOICA_EXPECTED_PRODUCTION_CERT_SHA256"
          bash ci/verify-release-security.sh app/build/outputs/apk/release/app-release.apk
          bash ci/verify-sherpa-package.sh apk app/build/outputs/apk/release/app-release.apk
          bash ci/verify-sherpa-package.sh aab app/build/outputs/bundle/release/app-release.aab
          bash ci/verify-room-schemas.sh

      - name: Generate production-signed provenance
        shell: bash
        env:
          VOICA_SOURCE_HEAD_SHA: ${{ env.VOICA_ACCEPTED_RC_SOURCE_SHA }}
        run: |
          set -euo pipefail
          bash ci/generate-release-provenance.sh \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/apk/releaseQa/app-releaseQa.apk \
            build/production-release-provenance.txt
          grep -qx 'production_signed=true' build/production-release-provenance.txt
          grep -qx "production_cert_sha256=${VOICA_EXPECTED_PRODUCTION_CERT_SHA256}" build/production-release-provenance.txt

      - name: Upload production-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Voica-V1-RC-production-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload production-signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Voica-V1-RC-production-signed-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload production signing provenance and mapping
        uses: actions/upload-artifact@v4
        with:
          name: Voica-V1-RC-production-signing-provenance
          path: |
            build/production-release-provenance.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove production keystore from runner
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [[ -n "${VOICA_RELEASE_STORE_FILE:-}" && -f "${VOICA_RELEASE_STORE_FILE}" ]]; then
            shred -u "${VOICA_RELEASE_STORE_FILE}" 2>/dev/null || rm -f "${VOICA_RELEASE_STORE_FILE}"
          fi

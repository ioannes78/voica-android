name: Stage 16A.2 Revision Wave A

on:
  push:
    branches: [ stage16a2-timeline-annotation ]
    paths:
      - "tools/stage16a2_wave_a_patch.py"
      - ".github/workflows/stage16a2-wave-a.yml"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wave-a-applied]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v5
        with:
          ref: stage16a2-timeline-annotation
          fetch-depth: 0

      - name: Apply revision wave A
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/RealtimeTranscriptionUiController/RealtimeTranscriptionScreen/g' tools/stage16a2_wave_a_patch.py
          python tools/stage16a2_wave_a_patch.py

      - name: Commit product changes and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/stage16a2_wave_a_patch.py .github/workflows/stage16a2-wave-a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(stage16a2): unify active capture annotations [wave-a-applied]"
          git push origin HEAD:stage16a2-timeline-annotation

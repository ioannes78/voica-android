name: Apply Post-V1 P0 planning order

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/update-post-v1-p0-planning.yml"

permissions:
  contents: write

jobs:
  update-planning:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify current main and update planning documents
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          # AGENTS.md — advance the actual next development stage without reopening Stage 14.
          replace_once(
              "AGENTS.md",
              """当前下一开发阶段：**Stage 15 — BLE 实时音频链路**。\n\nStage 14 已完成 V1.0 Release Freeze、production signing、30/60/120 分钟真实稳定性与最终 `1.0.0` 真机冒烟；任何 Stage 15 接管都必须重新读取 GitHub 当前 `main`、HEAD、CI、Room schema、Stage 14 Final Freeze/Handoff 与 production model channel，不能把本文记录的某个历史 SHA 当成当前状态。""",
              """当前下一开发阶段：**Post-V1 P0 — Canonical Audio Performance & UX**。\n\n当前执行顺序固定为：\n\n`Stage 14 V1.0（已冻结） → Post-V1 P0 → Stage 15`\n\nPost-V1 P0 完成开发、真机验收、Freeze/Handoff 并合并 `main` 后，才进入 **Stage 15 — BLE 实时音频链路**。\n\nStage 14 已完成 V1.0 Release Freeze、production signing、30/60/120 分钟真实稳定性与最终 `1.0.0` 真机冒烟；任何 Post-V1 P0 或 Stage 15 接管都必须重新读取 GitHub 当前 `main`、HEAD、CI、Room schema、Stage 14 Final Freeze/Handoff、Post-V1 P0 权威规划与 production model channel，不能把本文记录的某个历史 SHA 当成当前状态。"""
          )

          replace_once(
              "AGENTS.md",
              """### Stage 15–20 顺序\n\n- Stage 15：只负责 BLE realtime Audio → Opus → PCM 与实时媒体时间链。""",
              """### Post-V1 P0 / Stage 15–20 顺序\n\n- Post-V1 P0：Stage 14 V1.0 之后立即执行，专项优化 Canonical WAV 生成性能、真实生成进度与取消交互；独立于 Stage 15，不修改 BLE realtime 边界。规划目标版本为 `1.0.1` / versionCode `89`，开发开始时必须重新核验并最终确认。\n- Stage 15：只负责 BLE realtime Audio → Opus → PCM 与实时媒体时间链。"""
          )

          # Roadmap — insert Post-V1 P0 between Stage 14 and Stage 15.
          replace_once(
              "docs/ROADMAP_STAGE_13C_PLUS.md",
              """---\n\n# Stage 15 — BLE 实时音频链路""",
              """---\n\n# Post-V1 P0 — Canonical Audio Performance & UX\n\nStage 14 V1.0 Final Freeze 完成后、Stage 15 开始前，先执行本独立维护阶段。\n\n权威专项规划：\n\n`docs/POST_V1_CANONICAL_AUDIO_OPTIMIZATION_PLAN.md`\n\n本阶段范围固定为：\n\n- Canonical WAV 长音频生成性能 Profiling 与优化；\n- Canonical WAV Fast Path；\n- 重复全文件 I/O / SHA 审计；\n- buffer / allocation / GC / 顺序 I/O 优化；\n- 真实、可观察的 canonical generation progress contract；\n- Recording Detail 播放器内生成进度；\n- 删除独立大号“取消生成标准 WAV”按钮，将取消交互合并进播放器任务状态；\n- 30 / 60 / 120 分钟同样本 A/B benchmark 与真机稳定性验证。\n\n阶段边界：\n\n- 不重新打开 Stage 14 Freeze；\n- 不混入 Stage 15 BLE realtime audio；\n- production model channel 默认不变；\n- Room 优先保持 v12，只有 durable progress/recovery 的明确数据需求才允许受控 migration；\n- P2“ASR 直通压缩音频解码”默认不进入 `1.0.1`，需要独立证据与再次确认；\n- 规划目标发布版本为 `1.0.1` / versionCode `89`，开发开始前必须重新读取 `main` 并核验实际版本号。\n\n建议开发分支：\n\n`post-v1-canonical-audio-p0`\n\n建议 PR：\n\n`[APK] Post-V1 P0 — Canonical WAV Performance & UX`\n\nPost-V1 P0 必须完成 Unit Test / Build / CI、30/60/120 A/B 真机验证、用户明确“测试通过”、Freeze/Handoff 并合并 `main`，之后才进入 Stage 15。\n\n---\n\n# Stage 15 — BLE 实时音频链路"""
          )

          replace_once(
              "docs/ROADMAP_STAGE_13C_PLUS.md",
              """`Stage 13B → Stage 13C → Stage 14 → Stage 15 → Stage 16A → Stage 16B → Stage 17 → Stage 18 → Stage 19A → Stage 19B → Stage 19C → Stage 19D → Stage 20`""",
              """`Stage 13B → Stage 13C → Stage 14 → Post-V1 P0 → Stage 15 → Stage 16A → Stage 16B → Stage 17 → Stage 18 → Stage 19A → Stage 19B → Stage 19C → Stage 19D → Stage 20`"""
          )

          replace_once(
              "docs/ROADMAP_STAGE_13C_PLUS.md",
              """其中：\n\n- Stage 13C：说话人分离性能专项""",
              """其中：\n\n- Stage 13C：说话人分离性能专项\n- Post-V1 P0：Canonical WAV 生成性能、真实进度与取消交互优化；完成后再进入 Stage 15"""
          )

          # Post-V1 plan — promote from optional follow-up to the confirmed next stage.
          replace_once(
              "docs/POST_V1_CANONICAL_AUDIO_OPTIMIZATION_PLAN.md",
              "状态：**PLANNED / USER CONFIRMED / POST-V1 NON-BLOCKING**",
              "状态：**PLANNED / USER CONFIRMED / NEXT DEVELOPMENT STAGE**"
          )

          replace_once(
              "docs/POST_V1_CANONICAL_AUDIO_OPTIMIZATION_PLAN.md",
              """Voica 为独立项目；不得复制、迁移、继承、cherry-pick、机械翻译或改写 `ioannes78/voice-card-android` 的实现。\n\n---\n\n## 1. 真实问题基线""",
              """Voica 为独立项目；不得复制、迁移、继承、cherry-pick、机械翻译或改写 `ioannes78/voice-card-android` 的实现。\n\n---\n\n## 0. 阶段定位与发布目标\n\nStage 14 V1.0 已完成 Final Freeze/Handoff、production signing、GitHub Release 与最终真机冒烟。用户现已明确确认：**Post-V1 P0 在 Stage 15 之前优先开发**。\n\n当前执行顺序：\n\n`Stage 14 V1.0（FROZEN） → Post-V1 P0 → Stage 15`\n\n本专项作为独立开发阶段，不重新打开 Stage 14，也不占用 Stage 15 BLE realtime 范围。\n\n规划开发身份：\n\n- development branch：`post-v1-canonical-audio-p0`；\n- PR：`[APK] Post-V1 P0 — Canonical WAV Performance & UX`；\n- 目标发布：Voica `1.0.1`；\n- 规划 versionCode：`89`；\n- Room：优先保持 v12；\n- production model channel：默认保持 Stage 14 V1.0 pin，不执行 promotion；\n- P2 ASR 直通解码：默认不进入 `1.0.1`，只有 P0/P1 结果仍不足且用户再次确认时才独立推进。\n\n上述版本号是规划目标；正式编码前必须重新核验 `main` 当前 versionCode/versionName，不能仅凭本文历史值直接修改。\n\n本专项完成条件：Unit Test / Build / CI + 30/60/120 分钟 A/B 真机验证 + 用户明确“测试通过” + Freeze/Handoff + merge `main`。满足后才解锁 Stage 15。\n\n---\n\n## 1. 真实问题基线"""
          )

          replace_once(
              "docs/POST_V1_CANONICAL_AUDIO_OPTIMIZATION_PLAN.md",
              """- Stage 14 当前 production-signed V1 RC 不因本规划发生任何代码变化；\n- Stage 14.7B 已通过的 30 / 60 / 120 分钟证据保持有效；\n- 本规划文件本身不改变 Room schema、production model channel 或 APK/AAB；\n- 该专项属于 **V1 发布后的 P0 follow-up**；\n- 是否在进入 Stage 15 BLE 实时音频链路前优先实施，由 Stage 14 Final Handoff 后用户确认；\n- 若先实施本专项，应建立独立 development branch / PR，不在已冻结的 Stage 14 PR 上继续写生产代码。""",
              """- Stage 14 V1.0 Final Freeze 保持不变，本专项不得改写其冻结验收事实；\n- Stage 14.7B 已通过的 30 / 60 / 120 分钟稳定性证据继续作为 V1 baseline；\n- 本规划文件本身不改变 Room schema、production model channel 或已发布的 `v1.0.0` APK/AAB；\n- 该专项已由用户确认升级为 **V1 发布后的下一开发阶段**；\n- 必须在 Stage 15 BLE 实时音频链路之前完成；\n- 必须使用独立 development branch / PR，不在已冻结的 Stage 14 PR 上继续写生产代码；\n- 目标发布为 `1.0.1` / versionCode `89`，但编码前必须重新核验当前 `main`；\n- Room 优先保持 v12，production model channel 默认不变；\n- P2 ASR 直通解码不默认进入 `1.0.1`，需要独立性能证据与再次确认。"""
          )

          # Stage 14 Handoff — preserve the freeze, but record the post-freeze sequencing decision.
          replace_once(
              "docs/STAGE_14_HANDOFF.md",
              """下一阶段：**Stage 15 — UNBLOCKED only after PR #24 merge + main verification**\n\n日期：2026-10-10""",
              """冻结时解锁：**Stage 15 — after PR #24 merge + main verification**\n\n后续规划调整（2026-10-10 用户确认）：**Post-V1 P0 → Stage 15**。Stage 14 冻结事实不变；当前执行顺序以 `AGENTS.md`、`docs/ROADMAP_STAGE_13C_PLUS.md` 与 `docs/POST_V1_CANONICAL_AUDIO_OPTIMIZATION_PLAN.md` 为准。\n\n日期：2026-10-10"""
          )

          replace_once(
              "docs/STAGE_14_HANDOFF.md",
              """Stage 15 开始任何修改前必须重新核对：""",
              """Post-V1 P0 开始任何修改前必须重新核对；Post-V1 P0 完成 Freeze/Handoff 后，Stage 15 开始时也必须再次核对："""
          )

          replace_once(
              "docs/STAGE_14_HANDOFF.md",
              """该计划当前仅是 **Post-V1 P0 规划项**，没有进入 V1.0 binary。\n\nStage 15 不得未经明确确认将该优化静默混入 BLE realtime 开发；需要实施时应单独确认范围、benchmark 方案和 UI/UX，再建立独立修改链。""",
              """该计划没有进入 V1.0 binary；Stage 14 Final Freeze 仍保持不变。\n\n用户已在 Stage 14 完成后明确确认：**先实施 Post-V1 P0，再进入 Stage 15**。Post-V1 P0 必须使用独立分支/PR，并按专项规划完成 benchmark、UI/UX、真机验收与 Freeze/Handoff。"""
          )

          replace_once(
              "docs/STAGE_14_HANDOFF.md",
              """## 12. Stage 15 正式边界\n\n路线图下一阶段：\n\n**Stage 15 — BLE 实时音频链路**""",
              """## 12. Post-V1 P0 后的 Stage 15 正式边界\n\n当前路线图顺序：\n\n**Post-V1 P0 — Canonical Audio Performance & UX → Stage 15 — BLE 实时音频链路**\n\nPost-V1 P0 完成并 Freeze/Handoff 后，Stage 15 的正式边界仍为："""
          )

          replace_once(
              "docs/STAGE_14_HANDOFF.md",
              """9. 完成以上核验后，Stage 15 才真正解锁。""",
              """9. 完成以上 Stage 14 post-merge 核验后，Post-V1 P0 解锁；Post-V1 P0 完成真机验收、Freeze/Handoff 并合并 `main` 后，Stage 15 才真正进入开发。"""
          )

          # Public README project status should match the authoritative planning order.
          replace_once(
              "README.md",
              """下一阶段：\n\n**Stage 15 — BLE 实时音频链路**""",
              """当前下一开发阶段：\n\n**Post-V1 P0 — Canonical Audio Performance & UX**\n\n完成该专项并发布计划中的 `1.0.1` 后，再进入 **Stage 15 — BLE 实时音频链路**。"""
          )
          PY

      - name: Verify only planning/status documents changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf '%s\n' "$changed"
          expected="$(printf '%s\n' \
            AGENTS.md \
            README.md \
            docs/POST_V1_CANONICAL_AUDIO_OPTIMIZATION_PLAN.md \
            docs/ROADMAP_STAGE_13C_PLUS.md \
            docs/STAGE_14_HANDOFF.md | sort)"
          test "$changed" = "$expected"

      - name: Commit planning update and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/update-post-v1-p0-planning.yml
          git config user.name "ioannes78"
          git config user.email "70731599+ioannes78@users.noreply.github.com"
          git add AGENTS.md README.md docs/POST_V1_CANONICAL_AUDIO_OPTIMIZATION_PLAN.md docs/ROADMAP_STAGE_13C_PLUS.md docs/STAGE_14_HANDOFF.md .github/workflows/update-post-v1-p0-planning.yml
          git commit -m "docs: prioritize Post-V1 P0 before Stage 15"
          git push origin HEAD:main

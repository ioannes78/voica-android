name: Stage 16A.2 Room Schema Export

on:
  pull_request:
    branches: [ main ]
    paths:
      - "core/database/**"
      - ".github/workflows/stage16a2-schema-export.yml"

permissions:
  contents: read

jobs:
  export-room-schema:
    name: Export Room v14 Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Generate Room schema
        shell: bash
        run: |
          set -euo pipefail
          gradle :core:database:kspDebugKotlin --stacktrace
          grep -Fq '"version": 14' core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/14.json

      - name: Upload Room v14 schema
        uses: actions/upload-artifact@v4
        with:
          name: stage16a2-room-schema-14
          path: core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/14.json
          if-no-files-found: error
          retention-days: 1

name: Stage 16A.2 Room Schema Export

on:
  pull_request:
    branches: [ main ]
    paths:
      - "core/database/**"
      - ".github/workflows/stage16a2-schema-export.yml"

permissions:
  contents: write

jobs:
  export-room-schema:
    name: Export Room v14 Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Stage branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-37.1" "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Generate Room schema
        shell: bash
        run: |
          set -euo pipefail
          gradle :core:database:kspDebugKotlin --stacktrace
          grep -Fq '"version": 14' core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/14.json

      - name: Commit generated Room v14 schema
        shell: bash
        run: |
          set -euo pipefail
          schema="core/database/schemas/io.github.ioannes78.voica.database.VoicaDatabase/14.json"
          if git diff --quiet -- "$schema"; then
            echo "Room v14 schema already matches KSP output."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$schema"
          git commit -m "build(annotation): commit generated Room v14 schema"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: Stage 16A.2 Wire Annotation Runtime

on:
  pull_request:
    branches: [ main ]
    paths:
      - ".github/workflows/stage16a2-wire-annotation-runtime.yml"

permissions:
  contents: write

jobs:
  wire-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout Stage branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Patch AppContainer
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/io/github/ioannes78/voica/VoicaApplication.kt")
          text = path.read_text()

          old = '''    private val recordingDatabase = VoicaDatabase.create(application)\n\n    val recordingLibraryRepository ='''
          new = '''    private val recordingDatabase = VoicaDatabase.create(application)\n\n    val timelineAnnotationRepository =\n        io.github.ioannes78.voica.database.TimelineAnnotationRepository(recordingDatabase)\n    val timelineAnnotationAnchorResolver =\n        io.github.ioannes78.voica.database.TimelineAnnotationAnchorResolver(recordingDatabase)\n    val timelineAnnotationAttachmentStore =\n        TimelineAnnotationAttachmentStore(\n            context = application,\n            database = recordingDatabase,\n            annotationRepository = timelineAnnotationRepository,\n        )\n    val timelineAnnotationContentCoordinator =\n        TimelineAnnotationContentCoordinator(\n            repository = timelineAnnotationRepository,\n            attachmentStore = timelineAnnotationAttachmentStore,\n        )\n\n    val recordingLibraryRepository ='''
          if old not in text:
              raise SystemExit("recording database anchor not found")
          text = text.replace(old, new, 1)

          old = '''                    aiSummaryCoordinator = aiSummaryCoordinator,\n                ),\n        )\n\n    val storageManagementCoordinator ='''
          new = '''                    aiSummaryCoordinator = aiSummaryCoordinator,\n                ),\n            annotationAttachmentCleanup =\n                timelineAnnotationAttachmentStore::deleteAttachmentsForRecording,\n        )\n\n    val storageManagementCoordinator ='''
          if old not in text:
              raise SystemExit("delete coordinator anchor not found")
          text = text.replace(old, new, 1)

          old = '''        applicationScope.launch(Dispatchers.IO) {\n            recordingLibraryRepository.reconcilePendingDeletes()\n            runCatching {\n                stage16ARealtimePersistenceRepository.interruptNonTerminalRunsForSource('''
          new = '''        applicationScope.launch(Dispatchers.IO) {\n            val annotationDeleteCleanup =\n                runCatching { timelineAnnotationAttachmentStore.cleanupDeletingRecordings() }\n            if (\n                annotationDeleteCleanup.isSuccess &&\n                annotationDeleteCleanup.getOrThrow().blockedRecordingIds.isEmpty()\n            ) {\n                recordingLibraryRepository.reconcilePendingDeletes()\n            }\n            runCatching {\n                stage16ARealtimePersistenceRepository.interruptNonTerminalRunsForSource('''
          if old not in text:
              raise SystemExit("startup delete anchor not found")
          text = text.replace(old, new, 1)

          old = '''            runCatching { phoneMicrophoneRecoveryCoordinator.reconcileOnStartup() }\n            localAudioImportCoordinator.cleanupStaleStaging()'''
          new = '''            runCatching { phoneMicrophoneRecoveryCoordinator.reconcileOnStartup() }\n            runCatching { timelineAnnotationRepository.reconcilePending() }\n            runCatching { timelineAnnotationAttachmentStore.reconcileOnStartup() }\n            localAudioImportCoordinator.cleanupStaleStaging()'''
          if old not in text:
              raise SystemExit("startup annotation reconcile anchor not found")
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit runtime wiring and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage16a2-wire-annotation-runtime.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/ioannes78/voica/VoicaApplication.kt .github/workflows/stage16a2-wire-annotation-runtime.yml
          git commit -m "feat(annotation): wire annotation runtime lifecycle"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: FunASR CTC A3 Provenance Gate

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/funasr-ctc-a3-provenance-gate.yml"
      - "ci/funasr-ctc-a3/**"
      - "engine/sherpa/src/main/kotlin/io/github/ioannes78/voica/sherpa/SenseVoiceCtcTokenizer.kt"
      - "engine/sherpa/src/test/kotlin/io/github/ioannes78/voica/sherpa/SenseVoiceCtcTokenizerTest.kt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    name: ModelScope CTC provenance + tokenizer parity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned A3 provenance tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "modelscope-hub==0.4.0" \
            "tiktoken==0.12.0" \
            "PyYAML==6.0.2"

      - name: Verify ModelScope checkpoint provenance and build reference vectors
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/funasr-a3"
          python ci/funasr-ctc-a3/verify-a3-provenance.py --out "$out"
          test -s "$out/config.yaml"
          test -s "$out/multilingual.tiktoken"
          test -s "$out/sensevoice-ctc-parity.tsv"
          test -s "$out/a3-provenance.json"

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android test SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager \
            "platforms;android-37.1" \
            "build-tools;36.0.0"

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v5.0.2
        with:
          gradle-version: "9.6.0"
          cache-read-only: true

      - name: Verify Android tokenizer target-id parity
        shell: bash
        env:
          VOICA_FUNASR_CTC_TIKTOKEN: ${{ runner.temp }}/funasr-a3/multilingual.tiktoken
          VOICA_FUNASR_CTC_PARITY_VECTORS: ${{ runner.temp }}/funasr-a3/sensevoice-ctc-parity.tsv
        run: |
          set -euo pipefail
          gradle \
            :engine:sherpa:testDebugUnitTest \
            --tests 'io.github.ioannes78.voica.sherpa.SenseVoiceCtcTokenizerTest.matchesPinnedModelscopeTiktokenReferenceWhenProvided' \
            --stacktrace

      - name: Publish provenance summary without model artifacts
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Stage 16B A3 provenance checkpoint"
            echo
            echo '```json'
            cat "${RUNNER_TEMP}/funasr-a3/a3-provenance.json"
            echo '```'
            echo
            echo "No model.pt, ONNX, tokenizer, AAR, APK, or other binary artifact was uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
